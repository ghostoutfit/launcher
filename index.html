<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme (default) */
    --bg: #f0e6cd;
    --panel: #fbf5e9;
    --panel-2: #efe3cc;
    --ink: #262a30;
    --muted: #867c67;
    --line: #d8c7a6;
    --accent: #2d8bd4;
    --accent-2: #d9a328;
    --ground: #c7ab7a;
    /* Shared element colours (both themes) */
    --ball: #ff6b57;
    --ball2: #3b9eff;
    --boost: #4ade80;
    --cut: #ef5350;
    --fric: #e08a5a;
    --wall: #aab4c2;
    --target: #b98cff;
    --hand: 'Lexend', system-ui, 'Segoe UI', sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14;
    --panel: #141a24;
    --panel-2: #1b2330;
    --ink: #e7edf5;
    --muted: #8a97a8;
    --line: #2a3442;
    --accent: #3fb6ff;
    --accent-2: #ffce4a;
    --ground: #3a4656;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--hand);
    -webkit-user-select: none; user-select: none;
  }
  /* a tiny bit of sandy grain on the cream background (light mode only) */
  :root:not([data-theme="dark"]) body {
    background-image:
      radial-gradient(rgba(122,92,46,0.07) 0.8px, transparent 1.2px),
      radial-gradient(rgba(122,92,46,0.05) 0.8px, transparent 1.2px);
    background-size: 6px 6px, 9px 9px;
    background-position: 0 0, 3px 4px;
  }
  #app { max-width: 1120px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.01em; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; }

  #stage { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  #main { flex: 1; min-width: 320px; }
  #sidebar { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  #palette { padding: 11px; }
  #energyPanel { padding: 11px; }
  #energyPanel #energy { display: block; width: 100%; height: 200px; }

  /* Controls bar */
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    padding: 9px 16px; margin-bottom: 10px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .ctrl .row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 58px; }
  .spacer { flex: 1; }

  button {
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--panel-2); border: 2px solid var(--line);
    border-radius: 11px; padding: 7px 15px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06121c; border-color: #1e6fa3; }
  button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }

  #themeToggle {
    position: fixed; top: 14px; right: 16px; z-index: 60;
    width: 40px; height: 40px; padding: 0; border-radius: 12px; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
  }

  .toggle { display: inline-flex; border: 2px solid var(--line); border-radius: 11px; overflow: hidden; }
  .toggle button { border: none; border-radius: 0; background: transparent; padding: 7px 12px; color: var(--muted); }
  .toggle button.on { background: var(--accent-2); color: #241c00; }

  /* Scene */
  #sceneWrap { padding: 0; margin-bottom: 10px; overflow: hidden; }
  #scene { display: block; width: 100%; height: 188px; touch-action: none; }

  /* Graph */
  #graphCard { padding: 10px 14px 12px; }
  #graphTabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #graphTabs button { padding: 7px 12px; font-size: 13px; }
  #graphTabs button.active { background: var(--accent); color: #06121c; border-color: var(--accent); }
  #graphRow { display: flex; gap: 14px; align-items: stretch; }
  #graphPlot { position: relative; flex: 1 1 auto; min-width: 0; }
  #graph { display: block; width: 100%; height: 250px; }
  .axZoom {
    position: absolute; z-index: 2; font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px; color: var(--muted);
    background: rgba(20,26,36,0.82); border: 1px solid var(--line);
  }
  .axZoom:hover { color: var(--ink); border-color: var(--accent); }
  .axZoom.on { color: var(--accent); border-color: var(--accent); }
  #zoomY { top: 2px; left: 2px; }
  #zoomX { bottom: 30px; right: 4px; }
  @media (max-width: 720px) { #sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; } #sidebar > .panel { flex: 1 1 240px; } }

  /* Palette + energy panel */
  .ptitle { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 9px; margin-bottom: 6px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--panel-2); cursor: grab;
  }
  .chip:active { cursor: grabbing; }
  .chip .ico { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #1a2230; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .chip.boost .ico { background: var(--boost); color: #063; }
  .chip.cut .ico { background: var(--cut); color: #4a0a0a; }
  .chip.friction .ico { background: var(--fric); color: #3a1c08; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 6px); }
  .chip.wall .ico { background: var(--wall); color: #1c242e; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 4px, transparent 4px 8px); }
  .chip.target .ico { background: var(--target); color: #231141; font-size: 16px; }
  .chip.ball2 .ico { background: #1c2430; color: var(--ball2); font-size: 18px; }
  .chip .ctxt { font-size: 14px; line-height: 1.2; }
  .chip .ctxt b { display: block; font-size: 15px; }
  .chip .ctxt span { color: var(--muted); font-size: 12.5px; }
  #palette .phint { color: var(--muted); font-size: 13px; line-height: 1.35; margin: 6px 0 12px; }
  #clearBtn { width: 100%; }

  #dragGhost {
    position: fixed; z-index: 100; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0.92;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }

  /* Delete-confirm popover */
  #deleteConfirm {
    position: fixed; z-index: 210; width: 190px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    display: flex; flex-direction: column; gap: 10px;
  }
  #deleteConfirm[hidden] { display: none; }
  #deleteConfirm .dc-msg { font-size: 12px; color: var(--ink); line-height: 1.35; }
  #deleteConfirm .dc-btns { display: flex; gap: 8px; }
  #deleteConfirm .dc-btns button { flex: 1; padding: 7px; font-size: 12px; }
  #deleteConfirm .dc-btns button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <button id="themeToggle" aria-label="Toggle light/dark">🌙</button>
  <h1>LAUNCHER</h1>
  <div class="sub">Launch a ball along flat ground, drop track pieces in its path, and watch the motion graph build live.</div>

  <div id="stage">
    <div id="main">
      <div id="controls" class="panel">
        <div class="ctrl">
          <label>Launch speed</label>
          <div class="row">
            <input type="range" id="speed" min="1" max="12" step="1" value="6">
            <span class="val" id="speedVal">6 m/s</span>
          </div>
        </div>
        <div class="spacer"></div>
        <button id="launchBtn" class="primary">Launch</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div id="sceneWrap" class="panel">
        <canvas id="scene"></canvas>
      </div>

      <div id="graphCard" class="panel">
        <div id="graphTabs">
          <button data-g="position" class="active">Position–time</button>
          <button data-g="velocity">Velocity–time</button>
          <button data-g="both">Both Distance and Velocity</button>
        </div>
        <div id="graphRow">
          <div id="graphPlot">
            <canvas id="graph"></canvas>
            <button id="zoomY" class="axZoom" title="Double the vertical axis (always from zero)">Zoom out</button>
            <button id="zoomX" class="axZoom" title="Double the time axis (always from zero)">Zoom out</button>
          </div>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="palette" class="panel">
        <div class="ptitle">Track pieces</div>
        <div class="chip boost" data-piece="boost">
          <div class="ico">+4</div>
          <div class="ctxt"><b>Speed boost</b></div>
        </div>
        <div class="chip cut" data-piece="cut">
          <div class="ico">−4</div>
          <div class="ctxt"><b>Speed cut</b></div>
        </div>
        <div class="chip target" data-piece="target">
          <div class="ico">⇄</div>
          <div class="ctxt"><b>Target speed</b></div>
        </div>
        <div class="chip friction" data-piece="friction">
          <div class="ico">▦</div>
          <div class="ctxt"><b>Friction patch</b></div>
        </div>
        <div class="chip wall" data-piece="wall">
          <div class="ico">█</div>
          <div class="ctxt"><b>Wall</b></div>
        </div>
        <div class="chip ball2" data-piece="ball2">
          <div class="ico">●</div>
          <div class="ctxt"><b>Second ball</b></div>
        </div>
        <button id="clearBtn">Clear track</button>
      </div>

      <div id="energyPanel" class="panel">
        <div class="ptitle">Energy (J)</div>
        <canvas id="energy"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="deleteConfirm" hidden>
  <div class="dc-msg">Delete this <span id="dcName">piece</span>?</div>
  <div class="dc-btns">
    <button id="dcCancel">Cancel</button>
    <button id="dcDelete" class="danger">Delete</button>
  </div>
</div>

<script>
// ─── Model constants (metres, seconds, m/s) ───────────────────────────────────
const TRACK_LEN = 20;
const BALL_R    = 0.28;
let   FRICTION_DECEL = 2.5;   // deceleration under friction (m/s^2) — dev-tunable
const BOOST_DV  = 4;          // speed boost / cut (m/s)
const FRIC_LEN  = 2;          // friction patch length (m)
const TARGET_STEP = 2;        // target-speed increment (m/s)
const TARGET_MAX  = 12;       // max target-speed magnitude (m/s)
const MAX_TIME  = 60;         // hard safety cap (s)
const RUN_TIME_CAP = 16;      // keep the graph drawing out to here after the ball stops (s)
const MASS      = 1;          // kg (KE = ½·m·v²)

// ─── State ────────────────────────────────────────────────────────────────────
let v0 = 6, graphType = 'position';
let running = false, ballStopped = false, t = 0;
let v = 0, x = 0;             // live state of whichever ball is currently moving
let thermal = 0;             // energy lost to friction + impact (J)
let balls = [];              // every ball: {launcher, x, v, moving, color, d, samples:[{t,x,v,d}]}
let movingBall = null;       // the one ball currently in motion (null when all at rest)
let heldGate = null;         // a timed target holding the ball in its tube until its trigger time
let energyMax = 1;           // y-scale for the energy chart (J)
let lastFrame = 0;

const ke = () => 0.5 * MASS * v * v;

// Fixed graph axes (always from zero). Each axis zooms out (×2) independently.
const AXES = {
  position: { t: 5, y: 10 },
  velocity: { t: 5, y: 12 },
  both: { t: 5, yv: 12, yd: 20 },   // velocity (left axis) + distance (right axis)
};
let zoomX = false, zoomY = false;

// Placed track pieces
let boosts = [];             // {id, x, dv, used}  — speed boost (+dv)
let cuts = [];               // {id, x, dv, used}  — speed cut (−dv)
let fricZones = [];          // {id, x, len}
let walls = [];              // {id, x}
let targets = [];            // {id, x, mag, dir, time, used}  — target-speed gates
let secondBalls = [];        // {id, x}  — stationary balls that get hit (equal-mass swap)
let pieceId = 1;

// Drag state
let drag = null;             // { kind:'new'|'move', piece, el?, ghost? }
let lastClick = null;        // { el, time } — used to detect a double-click on a piece
let confirmPiece = null;     // { piece, el } awaiting delete confirmation

// ─── Elements ─────────────────────────────────────────────────────────────────
const sceneC = document.getElementById('scene');
const sx = sceneC.getContext('2d');
const graphC = document.getElementById('graph');
const gx = graphC.getContext('2d');
const energyC = document.getElementById('energy');
const ex = energyC.getContext('2d');
const speedEl = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const launchBtn = document.getElementById('launchBtn');

// ─── Scene geometry ───────────────────────────────────────────────────────────
const PAD_L = 24, PAD_R = 24;
function sceneDims() { return { w: sceneC.clientWidth, h: sceneC.clientHeight }; }
function groundY() { return sceneDims().h - 56; }   // surface line; solid ground fills below it
function ballRadius() { const { w } = sceneDims(); return Math.max(12, (BALL_R / TRACK_LEN) * (w - PAD_L - PAD_R) * 1.25); }
function mToPx(m) { const { w } = sceneDims(); return PAD_L + (m / TRACK_LEN) * (w - PAD_L - PAD_R); }
function pxToM(pxX) { const { w } = sceneDims(); return clamp(((pxX - PAD_L) / (w - PAD_L - PAD_R)) * TRACK_LEN, 0, TRACK_LEN); }
function clamp(a, lo, hi) { return Math.max(lo, Math.min(hi, a)); }

// ─── Physics (numerical integration) ──────────────────────────────────────────
function onFrictionZone(px) { return fricZones.some(z => px >= z.x && px <= z.x + z.len); }

// A piece at px is crossed when the ball moves from a to b through it (either direction).
function crossed(px, a, b) { return (px > a && px <= b) || (px < a && px >= b); }
function firstCrossed(arr, a, b, activeOnly) {
  let hit = null;
  for (const p of arr) {
    if (activeOnly && p.used) continue;
    if (crossed(p.x, a, b) && (!hit || Math.abs(p.x - a) < Math.abs(hit.x - a))) hit = p;
  }
  return hit;
}
// Nearest resting ball the moving ball reaches between a and b. Contact is when the
// centers are one diameter apart, so the contact point sits just short of the ball.
function firstBallHit(a, b) {
  const s = Math.sign(b - a); if (!s) return null;
  let hit = null;
  for (const ball of balls) {
    if (ball === movingBall || ball.moving) continue;
    const cp = ball.x - s * 2 * BALL_R;
    if (crossed(cp, a, b) && (!hit || Math.abs(cp - a) < Math.abs(hit.cp - a))) hit = { ball, cp };
  }
  return hit;
}

function step(dt) {
  const sub = 6, h = dt / sub;
  for (let i = 0; i < sub && !ballStopped; i++) {
    // friction opposes motion (works in either direction)
    const decel = onFrictionZone(x) ? FRICTION_DECEL : 0;
    const vBefore = v;
    if (decel > 0 && v !== 0) {
      const s = Math.sign(v), nv = v - s * decel * h;
      v = (Math.sign(nv) !== s) ? 0 : nv;
    }
    thermal += 0.5 * MASS * (vBefore * vBefore - v * v);   // friction work → heat
    if (Math.abs(v) <= 1e-4) { v = 0; ballStopped = true; break; }
    const nx = x + v * h;
    // wall: stop dead on impact (either direction), dumping remaining KE to heat
    const wl = firstCrossed(walls, x, nx, false);
    if (wl) { x = wl.x; thermal += 0.5 * MASS * v * v; v = 0; ballStopped = true; break; }
    // second ball: equal-mass elastic hit → this ball stops dead, the other takes its speed
    const hit = firstBallHit(x, nx);
    if (hit) {
      movingBall.x = hit.cp; movingBall.v = 0; movingBall.moving = false;  // incoming ball stops, touching
      hit.ball.moving = true; hit.ball.v = v;                              // struck ball takes the speed
      movingBall = hit.ball;
      x = hit.ball.x;                        // keep v; continue as the struck ball
      continue;
    }
    // target-speed gate
    const g = firstCrossed(targets, x, nx, true);
    if (g) {
      if (g.time != null && t < g.time) {       // too early → the tube holds the ball until its time
        x = g.x; thermal += 0.5 * MASS * v * v; v = 0; ballStopped = true; heldGate = g; break;
      }
      x = g.x;
      const vNew = g.dir * g.mag;
      thermal += Math.max(0, 0.5 * MASS * (v * v - vNew * vNew));  // only a slow-down adds heat
      v = vNew; g.used = true; g._shake = 1;    // kick off the tube's shake
      continue;
    }
    // speed boost (+ΔV)
    const b = firstCrossed(boosts, x, nx, true);
    if (b) { x = b.x; v += b.dv; b.used = true; b._shake = 1; continue; }
    // speed cut (−ΔV) — the lost kinetic energy goes to heat
    const c = firstCrossed(cuts, x, nx, true);
    if (c) { x = c.x; const vb = v; v -= c.dv; thermal += Math.max(0, 0.5 * MASS * (vb * vb - v * v)); c.used = true; c._shake = 1; continue; }
    x = nx;
    // the right/left edges are NOT walls: let the ball coast offscreen and keep going
  }
}

// ─── Run control ──────────────────────────────────────────────────────────────
// Build the ball set: the red launcher at 0, then the blue second balls where placed.
function buildBalls(launchV) {
  balls = [{ launcher: true, x: 0, v: launchV, moving: false, color: getCss('--ball'), d: 0, samples: [] }];
  for (const b of secondBalls) balls.push({ launcher: false, x: b.x, v: 0, moving: false, color: getCss('--ball2'), d: 0, samples: [] });
}
function seedSamples() { for (const b of balls) b.samples = [{ t: 0, x: b.x, v: b.v, d: 0 }]; }

function launch() {
  v0 = parseInt(speedEl.value, 10);
  boosts.forEach(b => { b.used = false; b._shake = 0; });
  cuts.forEach(c => { c.used = false; c._shake = 0; });
  targets.forEach(g => { g.used = false; g._shake = 0; });
  heldGate = null;
  buildBalls(v0);
  movingBall = balls[0]; movingBall.moving = true;
  running = true; ballStopped = false; t = 0; x = 0; v = v0; thermal = 0;
  seedSamples();
  energyMax = Math.max(1e-6, ke());
  lastFrame = performance.now();
  launchBtn.disabled = true;
}

function resetRun() {
  running = false; ballStopped = false; t = 0; x = 0; v = 0; thermal = 0; energyMax = 1;
  targets.forEach(g => g._shake = 0); boosts.forEach(b => b._shake = 0); cuts.forEach(c => c._shake = 0);
  heldGate = null;
  buildBalls(0); movingBall = null;
  launchBtn.disabled = false;
  drawScene(); drawGraph(); drawEnergy();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function frame(now) {
  if (running) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    t += dt;
    // a timed tube that's been holding the ball shoots it out at its trigger time
    if (heldGate && t >= heldGate.time) {
      v = heldGate.dir * heldGate.mag;
      heldGate.used = true; heldGate._shake = 1;
      ballStopped = false; if (movingBall) movingBall.moving = true;
      heldGate = null;
    }
    if (!ballStopped) step(dt);           // the moving ball halts at a wall, but time marches on
    if (movingBall) { movingBall.x = x; movingBall.v = v; if (ballStopped) movingBall.moving = false; }
    for (const el of [...targets, ...boosts, ...cuts]) { if (el._shake) { el._shake *= 0.85; if (el._shake < 0.02) el._shake = 0; } }
    // record every ball's trajectory so each can be graphed on the same axes
    for (const b of balls) {
      const prev = b.samples[b.samples.length - 1];
      b.d = prev.d + Math.abs(b.x - prev.x);
      b.samples.push({ t, x: b.x, v: b.v, d: b.d });
    }
    if (ke() + thermal > energyMax) energyMax = ke() + thermal;
    // free to relaunch once the ball is truly at rest (not merely held by a tube) or offscreen
    if ((ballStopped && !heldGate) || x > TRACK_LEN) launchBtn.disabled = false;
    // run ends when the graph's time axis is filled (safety cap otherwise)
    if (t >= RUN_TIME_CAP || t >= MAX_TIME) { running = false; launchBtn.disabled = false; }
    drawScene(); drawGraph(); drawEnergy();
  }
  requestAnimationFrame(frame);
}

// ─── Scene rendering ──────────────────────────────────────────────────────────
function fit(c) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  return { w, h, dpr };
}

function drawScene() {
  const { w, h, dpr } = fit(sceneC);
  sx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sx.clearRect(0, 0, w, h);
  const gY = groundY();

  // ground — a solid mass below the surface, with a lighter top soil band (cel-shaded depth)
  const groundCol = getCss('--ground');
  sx.fillStyle = darken(groundCol, 0.12); sx.fillRect(0, gY, w, h - gY);
  sx.fillStyle = lighten(groundCol, 0.14); sx.fillRect(0, gY, w, 7);           // surface soil

  // friction patches — rough ground SET INTO the surface (sits below it, not on top)
  const fricCol = getCss('--fric'), FD = 26;
  for (const z of fricZones) {
    const xa = mToPx(z.x), xb = mToPx(Math.min(TRACK_LEN, z.x + z.len)), w2 = xb - xa;
    sx.fillStyle = fricCol; sx.fillRect(xa, gY, w2, FD);
    sx.fillStyle = darken(fricCol, 0.2); sx.fillRect(xa, gY + FD * 0.58, w2, FD * 0.42);  // shade block
    // gritty speckles
    sx.save(); sx.beginPath(); sx.rect(xa, gY, w2, FD); sx.clip();
    sx.fillStyle = darken(fricCol, 0.45);
    for (let px = xa + 6; px < xb - 2; px += 9) for (let r2 = 0; r2 < 2; r2++) {
      const py = gY + 8 + r2 * 9 + (Math.floor(px) % 2 ? 0 : 4);
      sx.beginPath(); sx.arc(px + r2 * 4, py, 1.5, 0, 7); sx.fill();
    }
    sx.restore();
    // side + bottom outline (the top edge is the surface line, stroked below)
    ink(2.5); sx.beginPath(); sx.moveTo(xa, gY); sx.lineTo(xa, gY + FD); sx.lineTo(xb, gY + FD); sx.lineTo(xb, gY); sx.stroke();
    // end grips (resize handles)
    sx.fillStyle = lighten(fricCol, 0.25);
    roundRect(sx, xa - 3, gY - 3, 6, FD + 6, 3); sx.fill(); ink(2); sx.stroke();
    roundRect(sx, xb - 3, gY - 3, 6, FD + 6, 3); sx.fill(); ink(2); sx.stroke();
    z._sign = drawPieceSign((xa + xb) / 2, gY, 'friction', fricCol, '#4a2410', Math.round(z.len) + 'm');
  }

  // the surface line itself — bold, the ball rolls along here
  ink(3); sx.beginPath(); sx.moveTo(0, gY); sx.lineTo(w, gY); sx.stroke();

  // distance ticks + labels (down in the ground)
  sx.font = handFont(13, 600); sx.textAlign = 'center';
  for (let m = 0; m <= TRACK_LEN; m += 5) {
    const gxp = mToPx(m);
    ink(1.5); sx.beginPath(); sx.moveTo(gxp, gY); sx.lineTo(gxp, gY + 8); sx.stroke();
    sx.fillStyle = getCss('--ink'); sx.fillText(m + ' m', gxp, gY + 24);
  }

  // speed boosts (+dv) and speed cuts (−dv) — identical pads, opposite sign
  for (const b of boosts) drawPad(b, getCss('--boost'), '#06381f', '+');
  for (const c of cuts)   drawPad(c, getCss('--cut'),   '#4a0a0a', '−');

  // target-speed launchers — draw the sign here; the tube is drawn after the balls
  const tCol = getCss('--target');
  for (const g of targets) {
    const gx2 = mToPx(g.x), timed = g.time != null;
    const r = ballRadius(), L = 2.9 * r, H = 2 * r + 8;
    const tcy = gY - r, tubeTop = tcy - H / 2;
    g._tube = { cx: gx2, cy: tcy, L, H, top: tubeTop };

    // the sign (fixed size), on a post down to the tube
    const sw = 90, sh = 82, sbot = tubeTop - 6, sTop = sbot - sh, X = gx2 - sw / 2, Y = sTop;
    signPost(gx2, sbot, tubeTop + 2, tCol);
    panel3D(X, Y, sw, sh, 12, tCol);
    sx.textAlign = 'center'; sx.textBaseline = 'middle';

    // Row A — direction (arrows only)
    const dirW = 35, dirH = 22, dAy = Y + 7;
    const dirL = { x: X + 6, y: dAy, w: dirW, h: dirH }, dirR = { x: X + sw - 6 - dirW, y: dAy, w: dirW, h: dirH };
    for (const [z, on, arr] of [[dirL, g.dir < 0, '◀'], [dirR, g.dir > 0, '▶']]) {
      sx.fillStyle = on ? lighten(tCol, 0.5) : darken(tCol, 0.1);
      roundRect(sx, z.x, z.y, z.w, z.h, 6); sx.fill(); ink(1.6); sx.stroke();
      sx.fillStyle = on ? INK : lighten(tCol, 0.3);
      sx.font = handFont(14, 700);
      sx.fillText(arr, z.x + z.w / 2, z.y + z.h / 2 + 1);
    }

    // Row B — speed stepper (m/s next to the number)
    const sy = Y + 46;
    const minus = miniBtn(X + 14, sy, 9, '–', tCol, INK);
    const plus  = miniBtn(X + sw - 14, sy, 9, '+', tCol, INK);
    sx.fillStyle = '#fff'; sx.textBaseline = 'middle';
    sx.font = handFont(20, 800); const nw = sx.measureText('' + g.mag).width;
    sx.font = handFont(11, 600); const uw = sx.measureText(' m/s').width;
    const gx0 = gx2 - (nw + uw) / 2; sx.textAlign = 'left';
    sx.font = handFont(20, 800); sx.fillText(g.mag, gx0, sy);
    sx.font = handFont(11, 600); sx.fillText(' m/s', gx0 + nw, sy + 1);
    sx.textAlign = 'center';

    // Row C — timer (clock to add; just the number once a time is set)
    const cy = Y + sh - 13;
    let tMinus = null, tPlus = null, tToggle = null;
    if (!timed) {
      drawClock(gx2, cy, 8, lighten(tCol, 0.5));
      tToggle = { x: gx2 - 12, y: cy - 12, w: 24, h: 24 };
    } else {
      tMinus = miniBtn(X + 14, cy, 7, '–', darken(tCol, 0.05), '#fff');
      tPlus  = miniBtn(X + sw - 14, cy, 7, '+', darken(tCol, 0.05), '#fff');
      const ts = g.time.toFixed(1) + 's';
      sx.fillStyle = '#fff'; sx.font = handFont(15, 700); sx.fillText(ts, gx2, cy + 1);
      tToggle = { x: gx2 - 19, y: cy - 9, w: 38, h: 18 };     // tap to clear the timer
    }

    sx.textBaseline = 'alphabetic';
    g._ui = { bounds: { x: X, y: Y, w: sw, h: sh }, gx: gx2, gTop: tubeTop,
              tube: { x: gx2 - L / 2, y: tubeTop, w: L, h: H },
              dirL, dirR, minus, plus, tMinus, tPlus, tToggle, timed };
  }

  // walls — a chunky brick wall standing on the surface
  const wallCol = getCss('--wall');
  for (const wl of walls) {
    const wx = mToPx(wl.x), ww = 22, wT = gY - 48, wh = gY - wT, wl0 = wx - ww / 2;
    roundRect(sx, wl0, wT, ww, wh, 5); sx.fillStyle = wallCol; sx.fill();
    // flat shade block down the right third
    sx.save(); roundRect(sx, wl0, wT, ww, wh, 5); sx.clip();
    sx.fillStyle = darken(wallCol, 0.2); sx.fillRect(wl0 + ww * 0.66, wT, ww * 0.34, wh);
    // brick courses (offset every other row)
    sx.strokeStyle = INK; sx.lineWidth = 1.8; sx.lineCap = 'round';
    let row = 0;
    for (let yb = wT + 9; yb < gY; yb += 9) {
      sx.beginPath(); sx.moveTo(wl0, yb); sx.lineTo(wl0 + ww, yb); sx.stroke();
      const jx = wx + (row % 2 ? -ww / 4 : ww / 4);
      sx.beginPath(); sx.moveTo(jx, yb); sx.lineTo(jx, yb - 9); sx.stroke();
      row++;
    }
    sx.restore();
    roundRect(sx, wl0, wT, ww, wh, 5); ink(2.5); sx.stroke();
    wl._sign = drawPieceSign(wx, wT, 'wall', wallCol, '#1c242e');
  }

  // launch marker
  sx.strokeStyle = 'rgba(255,255,255,0.22)'; sx.setLineDash([5, 5]); sx.lineWidth = 1.5; sx.lineCap = 'round';
  sx.beginPath(); sx.moveTo(mToPx(0), gY - 70); sx.lineTo(mToPx(0), gY); sx.stroke();
  sx.setLineDash([]);

  // all balls, each in its own colour (resting ones drawn first, mover on top)
  for (const b of balls) if (!b.moving) drawBall(mToPx(b.x), gY, b.color);
  for (const b of balls) if (b.moving) drawBall(mToPx(b.x), gY, b.color);

  // target tubes drawn over the balls (so a ball sits fully inside); jiggle when fired
  for (const g of targets) {
    const u = g._tube; if (!u) continue;
    let jx = 0, jy = 0;
    if (running && g._shake > 0.02) { jx = (Math.random() * 2 - 1) * 8 * g._shake; jy = (Math.random() * 2 - 1) * 5 * g._shake; }
    drawTube(u.cx + jx, u.cy + jy, u.L, u.H, tCol);
  }
}

// A push pad (boost +dv / cut −dv): a pad on the ground + a sign whose +/- row sits above the
// value. The pad jiggles (half the target's shake) when it fires. sgn is '+' or '−'.
function drawPad(el, col, fgDark, sgn) {
  const gY = groundY();
  const bx = mToPx(el.x), padW = 40, padH = 15, top = gY - padH;
  let jx = 0, jy = 0;
  if (running && el._shake > 0.02) { jx = (Math.random() * 2 - 1) * 4 * el._shake; jy = (Math.random() * 2 - 1) * 2.5 * el._shake; }
  const pxc = bx + jx, pyt = top + jy;
  panelShaded(pxc - padW / 2, pyt, padW, padH, 6, col);
  ink(2.6);
  for (let k = 0; k < 3; k++) {
    const cxp = pxc - 11 + k * 10;
    sx.beginPath(); sx.moveTo(cxp - 4, pyt + 4); sx.lineTo(cxp + 4, pyt + padH / 2); sx.lineTo(cxp - 4, pyt + padH - 4); sx.stroke();
  }
  // sign: total height = half the target-speed box (82 → 41)
  const bw = 86, bh = 41, bbot = top - 12, BY = bbot - bh, BX = bx - bw / 2;
  signPost(bx, bbot, top, col);
  panelShaded(BX, BY, bw, bh, 11, col);
  // Row 1 — a big + or −
  sx.fillStyle = fgDark; sx.textAlign = 'center'; sx.textBaseline = 'middle';
  sx.font = handFont(24, 800); sx.fillText(sgn, bx, BY + 13);
  // Row 2 — (− button)  value m/s  (+ button)
  const minus = miniBtn(BX + 13, BY + 30, 9, '–', col, INK);
  const plus  = miniBtn(BX + bw - 13, BY + 30, 9, '+', col, INK);
  sx.fillStyle = fgDark;
  sx.font = handFont(15, 800); const nw = sx.measureText('' + el.dv).width;
  sx.font = handFont(10, 700); const uw = sx.measureText(' m/s').width;
  const gx0 = bx - (nw + uw) / 2; sx.textAlign = 'left';
  sx.font = handFont(15, 800); sx.fillText(el.dv, gx0, BY + 31);
  sx.font = handFont(10, 700); sx.fillText(' m/s', gx0 + nw, BY + 31);
  sx.textAlign = 'center'; sx.textBaseline = 'alphabetic';
  el._ui = { minus, plus };
  el._sign = { x: BX, y: BY, w: bw, h: bh };
}

// A flat cartoon ball on the ground line at gY: solid fill, flat shade block, bold outline, shine.
function drawBall(bx, gY, ballCol) {
  const r = ballRadius();
  const cyb = gY - r;
  sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); sx.fillStyle = ballCol; sx.fill();
  // flat shade crescent (a darker offset disc clipped to the ball)
  sx.save(); sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); sx.clip();
  sx.fillStyle = darken(ballCol, 0.22);
  sx.beginPath(); sx.arc(bx + r * 0.42, cyb + r * 0.42, r, 0, Math.PI * 2); sx.fill();
  sx.restore();
  sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); ink(2.5); sx.stroke();
  // flat round highlight
  sx.fillStyle = 'rgba(255,255,255,0.92)';
  sx.beginPath(); sx.arc(bx - r * 0.34, cyb - r * 0.34, r * 0.17, 0, 7); sx.fill();
}

// ─── Graph rendering ──────────────────────────────────────────────────────────
function graphSpec() {
  if (graphType === 'position') return { key: 'x', label: 'Position', unit: 'm' };
  return { key: 'v', label: 'Velocity', unit: 'm/s' };
}

function drawGraph() {
  const { w, h, dpr } = fit(graphC);
  gx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gx.clearRect(0, 0, w, h);
  const both = graphType === 'both';
  const base = AXES[graphType];
  const padL = 52, padR = both ? 46 : 16, padT = both ? 24 : 14, padB = 34;
  const x0 = padL, x1 = w - padR, y0 = h - padB, y1 = padT;
  const tMax = base.t * (zoomX ? 2 : 1);
  const yMaxL = (both ? base.yv : base.y) * (zoomY ? 2 : 1);    // left axis (velocity when 'both')
  const yMaxR = both ? base.yd * (zoomY ? 2 : 1) : null;        // right axis (distance when 'both')
  const X  = tt => x0 + (tt / tMax) * (x1 - x0);
  const YL = vv => y0 + (vv / yMaxL) * (y1 - y0);
  const YR = vv => y0 + (vv / yMaxR) * (y1 - y0);
  const velCol = getCss('--ball'), distCol = getCss('--accent-2');

  // horizontal gridlines + left-axis labels
  gx.font = handFont(13, 400); gx.strokeStyle = getCss('--line'); gx.lineWidth = 1;
  gx.fillStyle = both ? velCol : getCss('--muted'); gx.textAlign = 'right'; gx.textBaseline = 'middle';
  for (let i = 0; i <= 5; i++) {
    const vv = (yMaxL * i) / 5, yy = YL(vv);
    gx.beginPath(); gx.moveTo(x0, yy); gx.lineTo(x1, yy); gx.stroke();
    gx.fillText(vv.toFixed(yMaxL < 4 ? 1 : 0), x0 - 8, yy);
  }
  // right-axis (distance) labels for 'both'
  if (both) {
    gx.fillStyle = distCol; gx.textAlign = 'left';
    for (let i = 0; i <= 5; i++) gx.fillText(((yMaxR * i) / 5).toFixed(0), x1 + 6, YR((yMaxR * i) / 5));
  }

  // time axis: major ticks every 1 s (labelled) + minor ticks every 0.5 s
  gx.strokeStyle = getCss('--line'); gx.fillStyle = getCss('--muted');
  gx.textAlign = 'center'; gx.textBaseline = 'top';
  for (let tt = 0; tt <= tMax + 1e-9; tt += 0.5) {
    const xx = X(tt), major = Math.abs(tt - Math.round(tt)) < 1e-9;
    gx.lineWidth = 1; gx.beginPath(); gx.moveTo(xx, y0); gx.lineTo(xx, y0 + (major ? 6 : 3)); gx.stroke();
    if (major) gx.fillText(tt.toFixed(0), xx, y0 + 9);
  }
  gx.fillStyle = getCss('--muted'); gx.fillText('time (s)', (x0 + x1) / 2, h - 14);

  // axis titles
  gx.save(); gx.translate(14, (y0 + y1) / 2); gx.rotate(-Math.PI / 2); gx.textAlign = 'center'; gx.textBaseline = 'bottom';
  if (both) { gx.fillStyle = velCol; gx.fillText('velocity (m/s)', 0, 0); }
  else { const spec = graphSpec(); gx.fillStyle = getCss('--muted'); gx.fillText(spec.label + ' (' + spec.unit + ')', 0, 0); }
  gx.restore();
  if (both) { gx.save(); gx.translate(w - 11, (y0 + y1) / 2); gx.rotate(Math.PI / 2); gx.textAlign = 'center'; gx.textBaseline = 'bottom'; gx.fillStyle = distCol; gx.fillText('distance (m)', 0, 0); gx.restore(); }

  // traces
  gx.save();
  gx.beginPath(); gx.rect(x0, y1, x1 - x0, y0 - y1); gx.clip();
  gx.lineWidth = 2.4; gx.lineJoin = 'round'; gx.lineCap = 'round';
  if (both) {
    for (const b of balls) {
      if (b.samples.length < 2) continue;
      gx.strokeStyle = b.color;
      gx.setLineDash([]); gx.beginPath();
      b.samples.forEach((s, i) => { const xx = X(s.t), yy = YL(s.v); i ? gx.lineTo(xx, yy) : gx.moveTo(xx, yy); }); gx.stroke();
      gx.setLineDash([5, 4]); gx.beginPath();
      b.samples.forEach((s, i) => { const xx = X(s.t), yy = YR(s.d); i ? gx.lineTo(xx, yy) : gx.moveTo(xx, yy); }); gx.stroke();
    }
    gx.setLineDash([]);
  } else {
    const spec = graphSpec();
    for (const b of balls) {
      if (b.samples.length < 2) continue;
      gx.strokeStyle = b.color;
      gx.beginPath();
      b.samples.forEach((s, i) => { const xx = X(s.t), yy = YL(s[spec.key]); i ? gx.lineTo(xx, yy) : gx.moveTo(xx, yy); }); gx.stroke();
      const last = b.samples[b.samples.length - 1];
      gx.fillStyle = b.color; gx.beginPath(); gx.arc(X(last.t), YL(last[spec.key]), 4.5, 0, Math.PI * 2); gx.fill();
    }
  }
  gx.restore();

  // legend (solid = velocity, dashed = distance) for 'both'
  if (both) {
    gx.font = handFont(11, 600); gx.textAlign = 'left'; gx.textBaseline = 'middle';
    const ly = y1 - 11;
    gx.lineWidth = 2.4; gx.strokeStyle = getCss('--ink');
    gx.setLineDash([]); gx.beginPath(); gx.moveTo(x0 + 2, ly); gx.lineTo(x0 + 18, ly); gx.stroke();
    gx.fillStyle = getCss('--muted'); gx.fillText('velocity', x0 + 22, ly);
    gx.setLineDash([5, 4]); gx.beginPath(); gx.moveTo(x0 + 78, ly); gx.lineTo(x0 + 94, ly); gx.stroke(); gx.setLineDash([]);
    gx.fillText('distance', x0 + 98, ly);
  }
}

// ─── Energy bar charts (KE, TH) ─────────────────────────────────────────────
function drawEnergy() {
  const { w, h, dpr } = fit(energyC);
  ex.setTransform(dpr, 0, 0, dpr, 0, 0);
  ex.clearRect(0, 0, w, h);

  const hasRun = balls.length && balls[0].samples.length > 0;
  const keV = hasRun ? ke() : 0, thV = hasRun ? thermal : 0;
  const eMax = Math.max(1e-6, energyMax);

  const padT = 22, padB = 40, baseY = h - padB, topY = padT;
  const plotH = baseY - topY;
  const bars = [
    { lab: 'KE', val: keV, col: getCss('--accent'), sub: 'kinetic' },
    { lab: 'TH', val: thV, col: getCss('--fric'),   sub: 'thermal' },
  ];
  const n = bars.length, slot = w / n, bw = Math.min(42, slot * 0.56);

  // gridlines
  ex.strokeStyle = getCss('--line'); ex.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const yy = baseY - (plotH * i) / 4; ex.beginPath(); ex.moveTo(0, yy); ex.lineTo(w, yy); ex.stroke(); }

  bars.forEach((b, i) => {
    const cx = slot * (i + 0.5), bh = (clamp(b.val, 0, eMax) / eMax) * plotH;
    const bx = cx - bw / 2, by = baseY - bh;
    if (bh > 0.5) { ex.fillStyle = b.col; ex.fillRect(bx, by, bw, bh);
      ex.strokeStyle = INK; ex.lineWidth = 2; ex.lineJoin = 'round'; ex.strokeRect(bx, by, bw, bh); }
    // value
    ex.fillStyle = getCss('--ink'); ex.font = handFont(14, 400);
    ex.textAlign = 'center'; ex.textBaseline = 'bottom';
    ex.fillText(b.val.toFixed(1), cx, by - 3);
    // labels
    ex.fillStyle = b.col; ex.font = handFont(16, 400); ex.textBaseline = 'top';
    ex.fillText(b.lab, cx, baseY + 6);
    ex.fillStyle = getCss('--muted'); ex.font = handFont(12, 400);
    ex.fillText(b.sub, cx, baseY + 22);
  });
}

function getCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ─── Colour + hand-drawn cartoon helpers ────────────────────────────────────
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixC(hex, target, t) { const [r, g, b] = hexRgb(hex); const f = c => Math.round(c + (target - c) * t); return `rgb(${f(r)},${f(g)},${f(b)})`; }
const lighten = (hex, t) => mixC(hex, 255, t);
const darken  = (hex, t) => mixC(hex, 0, t);

const INK = '#1a2230';                 // bold outline colour
const handFont = (size, weight) => (weight || 600) + ' ' + size + "px 'Lexend', system-ui, sans-serif";
function ink(width) { sx.strokeStyle = INK; sx.lineWidth = width; sx.lineJoin = 'round'; sx.lineCap = 'round'; }

// A flat two-tone panel: solid fill + a darker bottom "shade block" + bold ink outline.
function panelShaded(x, y, w, h, r, hex) {
  roundRect(sx, x, y, w, h, r); sx.fillStyle = hex; sx.fill();
  sx.save(); roundRect(sx, x, y, w, h, r); sx.clip();
  sx.fillStyle = darken(hex, 0.18); sx.fillRect(x, y + h * 0.62, w, h * 0.38);  // flat shade block
  sx.restore();
  roundRect(sx, x, y, w, h, r); ink(2.5); sx.stroke();
}

// A flat panel with a solid fill and a bold, smooth ink outline (no gradient, no shadow).
function panel3D(x, y, w, h, r, hex) {
  roundRect(sx, x, y, w, h, r);
  sx.fillStyle = hex; sx.fill();
  ink(2.5); sx.stroke();
}

// A little post connecting a sign down to its element, with an outlined knob where they meet.
function signPost(cx, topY, botY, hex) {
  ink(2.5); sx.beginPath(); sx.moveTo(cx, topY); sx.lineTo(cx, botY); sx.stroke();
  sx.beginPath(); sx.arc(cx, botY, 3.6, 0, 7); sx.fillStyle = hex; sx.fill(); ink(2); sx.stroke();
}

// A floating display sign (flat outlined panel on a post) with a hand-lettered label + optional sub-line.
function drawPieceSign(cx, elTopY, label, hex, fg, sub) {
  sx.font = handFont(17, 700);
  const tw = sx.measureText(label).width;
  let sw = Math.max(54, tw + 26), sh = sub ? 42 : 30;
  const syBot = elTopY - 15, syTop = syBot - sh;
  signPost(cx, syTop + sh, elTopY, hex);
  panelShaded(cx - sw / 2, syTop, sw, sh, 10, hex);
  sx.fillStyle = fg; sx.textAlign = 'center'; sx.textBaseline = 'middle';
  sx.font = handFont(17, 700);
  sx.fillText(label, cx, sub ? syTop + 15 : syTop + sh / 2 + 1);
  if (sub) {
    sx.font = handFont(13, 600); sx.fillStyle = lighten(hex, 0.55);
    sx.fillText(sub, cx, syTop + 31);
  }
  sx.textBaseline = 'alphabetic';
  return { x: cx - sw / 2, y: syTop, w: sw, h: sh };
}

// A small flat outlined round button (used for +/- on the target sign). Returns its hit circle.
function miniBtn(cx, cy, rad, label, hex, fg) {
  sx.beginPath(); sx.arc(cx, cy, rad, 0, 7); sx.fillStyle = lighten(hex, 0.2); sx.fill();
  ink(2); sx.stroke();
  sx.fillStyle = fg; sx.font = handFont(Math.round(rad * 1.9), 400);
  sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillText(label, cx, cy + 1);
  sx.textBaseline = 'alphabetic';
  return { cx, cy, r: rad };
}

// A horizontal tube (pipe) the ball shoots out of.
function drawTube(cx, cy, L, H, hex) {
  const x = cx - L / 2, y = cy - H / 2, r = Math.min(H / 2, 11);
  roundRect(sx, x, y, L, H, r); sx.fillStyle = hex; sx.fill();
  sx.save(); roundRect(sx, x, y, L, H, r); sx.clip();
  sx.fillStyle = darken(hex, 0.18); sx.fillRect(x, cy + H * 0.1, L, H * 0.4);   // shade block
  sx.restore();
  roundRect(sx, x, y, L, H, r); ink(2.5); sx.stroke();
  // open ends (dark holes the ball enters/leaves through)
  sx.fillStyle = darken(hex, 0.42);
  sx.beginPath(); sx.ellipse(x + 4.5, cy, 3, H / 2 - 5, 0, 0, 7); sx.fill();
  sx.beginPath(); sx.ellipse(x + L - 4.5, cy, 3, H / 2 - 5, 0, 0, 7); sx.fill();
}

// A little clock face with two hands (used for the timer control + the timed gate).
function drawClock(cx, cy, r, face) {
  sx.beginPath(); sx.arc(cx, cy, r, 0, 7); sx.fillStyle = face; sx.fill(); ink(1.8); sx.stroke();
  ink(1.8);
  sx.beginPath();
  sx.moveTo(cx, cy); sx.lineTo(cx, cy - r * 0.6);
  sx.moveTo(cx, cy); sx.lineTo(cx + r * 0.5, cy + r * 0.15);
  sx.stroke();
}

// ─── Drag & drop ──────────────────────────────────────────────────────────────
const inBox = (mx, my, b) => b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
const inCircle = (mx, my, c) => c && Math.hypot(mx - c.cx, my - c.cy) <= c.r + 2;

// Interactive controls on a target sign (direction / speed / timer). Checked before any drag.
function hitTargetControl(mx, my) {
  for (const g of targets) {
    const u = g._ui; if (!u) continue;
    if (inBox(mx, my, u.dirL)) return { g, kind: 'dirL' };
    if (inBox(mx, my, u.dirR)) return { g, kind: 'dirR' };
    if (inCircle(mx, my, u.minus)) return { g, kind: 'magMinus' };
    if (inCircle(mx, my, u.plus)) return { g, kind: 'magPlus' };
    if (inCircle(mx, my, u.tMinus)) return { g, kind: 'timeMinus' };
    if (inCircle(mx, my, u.tPlus)) return { g, kind: 'timePlus' };
    if (inBox(mx, my, u.tToggle)) return { g, kind: 'timeToggle' };
  }
  return null;
}
function applyTargetControl(c) {
  const g = c.g;
  if (c.kind === 'dirL') g.dir = -1;
  else if (c.kind === 'dirR') g.dir = 1;
  else if (c.kind === 'magMinus') g.mag = clamp(g.mag - TARGET_STEP, TARGET_STEP, TARGET_MAX);
  else if (c.kind === 'magPlus') g.mag = clamp(g.mag + TARGET_STEP, TARGET_STEP, TARGET_MAX);
  else if (c.kind === 'timeToggle') g.time = (g.time == null) ? 2 : null;
  else if (c.kind === 'timeMinus') g.time = clamp(+(g.time - 0.5).toFixed(1), 0, RUN_TIME_CAP);
  else if (c.kind === 'timePlus') g.time = clamp(+(g.time + 0.5).toFixed(1), 0, RUN_TIME_CAP);
}

// +/- steppers on a boost or cut sign
function hitPadControl(mx, my) {
  for (const el of [...boosts, ...cuts]) {
    const u = el._ui; if (!u) continue;
    if (inCircle(mx, my, u.minus)) return { el, kind: 'minus' };
    if (inCircle(mx, my, u.plus)) return { el, kind: 'plus' };
  }
  return null;
}
function applyPadControl(c) {
  c.el.dv = clamp(c.el.dv + (c.kind === 'plus' ? TARGET_STEP : -TARGET_STEP), TARGET_STEP, TARGET_MAX);
}

function hitPiece(mx, my) {
  const gY = groundY();
  // targets own a tall sign — test its full bounds or the tube
  for (const g of targets) {
    const u = g._ui;
    if (u && (inBox(mx, my, u.bounds) || inBox(mx, my, u.tube)))
      return { type: 'target', el: g };
  }
  // walls & boosts: their body on the ground, or their floating sign
  for (const wl of walls) if (Math.abs(mToPx(wl.x) - mx) < 14 && my >= gY - 50 && my <= gY + 6 || inBox(mx, my, wl._sign))
    return { type: 'wall', el: wl };
  for (const b of boosts) if (Math.abs(mToPx(b.x) - mx) < 22 && my >= gY - 17 && my <= gY + 6 || inBox(mx, my, b._sign))
    return { type: 'boost', el: b };
  for (const c of cuts) if (Math.abs(mToPx(c.x) - mx) < 22 && my >= gY - 17 && my <= gY + 6 || inBox(mx, my, c._sign))
    return { type: 'cut', el: c };
  // second balls: grab the sphere itself
  const br = Math.max(12, (BALL_R / TRACK_LEN) * (sceneDims().w - PAD_L - PAD_R) * 1.25);
  for (const bb of secondBalls) if (Math.abs(mToPx(bb.x) - mx) < br + 3 && my >= gY - 2 * br - 4 && my <= gY + 6)
    return { type: 'ball2', el: bb };
  // friction patch: rough ground set into the surface (resize edges) or its sign
  for (const z of fricZones) {
    const xa = mToPx(z.x), xb = mToPx(z.x + z.len);
    if ((mx >= xa - 6 && mx <= xb + 6 && my >= gY - 4 && my <= gY + 28)) {
      const edge = Math.abs(mx - xa) <= 7 ? 'l' : Math.abs(mx - xb) <= 7 ? 'r' : null;
      return { type: 'friction', el: z, edge };
    }
    if (inBox(mx, my, z._sign)) return { type: 'friction', el: z, edge: null };
  }
  return null;
}

function makeGhost(piece) {
  const g = document.createElement('div'); g.id = 'dragGhost';
  if (piece === 'boost') { g.textContent = '+' + BOOST_DV + ' m/s'; g.style.background = getCss('--boost'); g.style.color = '#063'; }
  else if (piece === 'cut') { g.textContent = '−' + BOOST_DV + ' m/s'; g.style.background = getCss('--cut'); g.style.color = '#4a0a0a'; }
  else if (piece === 'wall') { g.textContent = 'wall'; g.style.background = getCss('--wall'); g.style.color = '#1c242e'; }
  else if (piece === 'target') { g.textContent = '▶ 6 m/s'; g.style.background = getCss('--target'); g.style.color = '#231141'; }
  else if (piece === 'ball2') { g.textContent = '● ball'; g.style.background = getCss('--ball'); g.style.color = '#2a0f0a'; }
  else { g.textContent = 'friction 2 m'; g.style.background = getCss('--fric'); g.style.color = '#3a1c08'; }
  document.body.appendChild(g); return g;
}
function moveGhost(g, cx, cy) { g.style.left = cx + 'px'; g.style.top = cy + 'px'; }

const snap = m => Math.round(m);   // placement snaps to 1 m increments
function placePiece(type, m) {
  if (type === 'boost') boosts.push({ id: pieceId++, x: clamp(snap(m), 0, TRACK_LEN), dv: BOOST_DV, used: false });
  else if (type === 'cut') cuts.push({ id: pieceId++, x: clamp(snap(m), 0, TRACK_LEN), dv: BOOST_DV, used: false });
  else if (type === 'wall') walls.push({ id: pieceId++, x: clamp(snap(m), 0, TRACK_LEN) });
  else if (type === 'target') { const g = { id: pieceId++, x: clamp(snap(m), 0, TRACK_LEN), mag: 6, dir: 1, time: null, used: false }; targets.push(g); return g; }
  else if (type === 'ball2') secondBalls.push({ id: pieceId++, x: clamp(snap(m), 0, TRACK_LEN) });
  else fricZones.push({ id: pieceId++, x: clamp(snap(m - FRIC_LEN / 2), 0, TRACK_LEN - FRIC_LEN), len: FRIC_LEN });
}

function overScene(cx, cy) {
  const r = sceneC.getBoundingClientRect();
  return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
}

// Start a drag from a palette chip (create new piece)
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('pointerdown', e => {
    e.preventDefault();
    const piece = chip.dataset.piece;
    drag = { kind: 'new', piece, ghost: makeGhost(piece) };
    moveGhost(drag.ghost, e.clientX, e.clientY);
  });
});

// Start a drag on an existing placed piece (move / remove), or tap a target's sign controls
sceneC.addEventListener('pointerdown', e => {
  const r = sceneC.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  // on-sign controls take priority over dragging
  const ctl = hitTargetControl(mx, my);
  if (ctl) {
    e.preventDefault();
    applyTargetControl(ctl);
    if (!running) resetRun(); else drawScene();
    return;
  }
  const bctl = hitPadControl(mx, my);
  if (bctl) {
    e.preventDefault();
    applyPadControl(bctl);
    if (!running) resetRun(); else drawScene();
    return;
  }
  const hit = hitPiece(mx, my);
  if (!hit) return;
  e.preventDefault();
  sceneC.setPointerCapture(e.pointerId);
  // grabbing a friction patch's end → resize; its middle → move
  const kind = (hit.type === 'friction' && hit.edge) ? 'resize' : 'move';
  drag = { kind, piece: hit.type, el: hit.el, edge: hit.edge, downX: e.clientX, downY: e.clientY, moved: false };
});

// Cursor hint when hovering placed pieces (resize vs grab)
sceneC.addEventListener('pointermove', e => {
  if (drag) return;
  const r = sceneC.getBoundingClientRect();
  const hit = hitPiece(e.clientX - r.left, e.clientY - r.top);
  sceneC.style.cursor = !hit ? 'default' : (hit.type === 'friction' && hit.edge) ? 'ew-resize' : 'grab';
});

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.kind === 'new') {
    moveGhost(drag.ghost, e.clientX, e.clientY);
  } else if (drag.kind === 'move') {
    if (Math.hypot(e.clientX - drag.downX, e.clientY - drag.downY) > 4) drag.moved = true;
    const r = sceneC.getBoundingClientRect();
    const m = pxToM(e.clientX - r.left);
    if (drag.piece === 'friction') drag.el.x = clamp(snap(m - drag.el.len / 2), 0, TRACK_LEN - drag.el.len);
    else drag.el.x = clamp(snap(m), 0, TRACK_LEN);
    if (!running) { resetRun(); } else { drawScene(); }
  } else if (drag.kind === 'resize') {
    const r = sceneC.getBoundingClientRect();
    const z = drag.el, m = snap(pxToM(e.clientX - r.left));
    if (drag.edge === 'l') {           // left end moves; right end stays put
      const right = z.x + z.len, nl = clamp(m, 0, right - 1);
      z.x = nl; z.len = right - nl;
    } else {                           // right end moves; left end stays put
      const nr = clamp(m, z.x + 1, TRACK_LEN);
      z.len = nr - z.x;
    }
    if (!running) { resetRun(); } else { drawScene(); }
  }
});

window.addEventListener('pointerup', e => {
  if (!drag) return;
  if (drag.kind === 'new') {
    drag.ghost.remove();
    if (overScene(e.clientX, e.clientY)) {
      const r = sceneC.getBoundingClientRect();
      placePiece(drag.piece, pxToM(e.clientX - r.left));
      if (!running) resetRun(); else drawScene();
    }
  } else if (drag.kind === 'move') {
    if (!overScene(e.clientX, e.clientY)) {
      // drop off the track → delete
      deletePiece(drag.piece, drag.el);
    } else if (!drag.moved) {
      // a click (no drag) on a piece — double-click asks to delete it
      const piece = drag.piece, el = drag.el, now = performance.now();
      if (lastClick && lastClick.el === el && now - lastClick.time < 400) {
        lastClick = null;
        openDeleteConfirm(piece, el, e.clientX, e.clientY);
      } else {
        lastClick = { el, time: now };
      }
    }
  }
  drag = null;
});

function deletePiece(piece, el) {
  if (piece === 'boost') boosts = boosts.filter(b => b !== el);
  else if (piece === 'cut') cuts = cuts.filter(c => c !== el);
  else if (piece === 'wall') walls = walls.filter(w => w !== el);
  else if (piece === 'target') targets = targets.filter(g => g !== el);
  else if (piece === 'ball2') secondBalls = secondBalls.filter(b => b !== el);
  else fricZones = fricZones.filter(z => z !== el);
  if (!running) resetRun(); else drawScene();
}

// ─── Wiring ───────────────────────────────────────────────────────────────────
speedEl.addEventListener('input', () => {
  speedVal.textContent = parseInt(speedEl.value, 10) + ' m/s';
  if (!running) resetRun();
});
document.getElementById('graphTabs').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  graphType = btn.dataset.g;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
  drawGraph();
});
launchBtn.addEventListener('click', launch);
document.getElementById('resetBtn').addEventListener('click', resetRun);
const zoomXBtn = document.getElementById('zoomX'), zoomYBtn = document.getElementById('zoomY');
zoomXBtn.addEventListener('click', () => {
  zoomX = !zoomX;
  zoomXBtn.textContent = zoomX ? 'Zoom in' : 'Zoom out';
  zoomXBtn.classList.toggle('on', zoomX);
  drawGraph();
});
zoomYBtn.addEventListener('click', () => {
  zoomY = !zoomY;
  zoomYBtn.textContent = zoomY ? 'Zoom in' : 'Zoom out';
  zoomYBtn.classList.toggle('on', zoomY);
  drawGraph();
});
document.getElementById('clearBtn').addEventListener('click', () => { boosts = []; cuts = []; fricZones = []; walls = []; targets = []; secondBalls = []; closeDeleteConfirm(); if (!running) resetRun(); else drawScene(); });
window.addEventListener('resize', () => { drawScene(); drawGraph(); drawEnergy(); });

// ─── Light / dark theme (light by default) ──────────────────────────────────────
const themeBtn = document.getElementById('themeToggle');
function applyTheme(mode) {
  if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  drawScene(); drawGraph(); drawEnergy();
}
let theme = 'light';
try { if (localStorage.getItem('launcher-theme') === 'dark') theme = 'dark'; } catch (e) {}
themeBtn.addEventListener('click', () => {
  theme = (theme === 'dark') ? 'light' : 'dark';
  try { localStorage.setItem('launcher-theme', theme); } catch (e) {}
  applyTheme(theme);
});
applyTheme(theme);

// ─── Delete confirmation (double-click a piece) ─────────────────────────────────
const dcEl = document.getElementById('deleteConfirm');
const dcName = document.getElementById('dcName');
const PIECE_NAMES = { boost: 'speed boost', cut: 'speed cut', wall: 'wall', target: 'target speed', friction: 'friction patch', ball2: 'second ball' };
function openDeleteConfirm(piece, el, cx, cy) {
  confirmPiece = { piece, el };
  dcName.textContent = PIECE_NAMES[piece] || 'piece';
  dcEl.hidden = false;
  let left = Math.min(cx + 12, window.innerWidth - dcEl.offsetWidth - 8);
  let top = Math.min(cy + 12, window.innerHeight - dcEl.offsetHeight - 8);
  dcEl.style.left = Math.max(8, left) + 'px';
  dcEl.style.top = Math.max(8, top) + 'px';
}
function closeDeleteConfirm() { confirmPiece = null; dcEl.hidden = true; }
document.getElementById('dcCancel').addEventListener('click', closeDeleteConfirm);
document.getElementById('dcDelete').addEventListener('click', () => {
  if (confirmPiece) deletePiece(confirmPiece.piece, confirmPiece.el);
  closeDeleteConfirm();
});
// click outside closes the confirm popover
window.addEventListener('pointerdown', e => {
  if (dcEl.hidden) return;
  if (dcEl.contains(e.target)) return;
  if (e.target === sceneC) return;   // scene handler may reopen it for another piece
  closeDeleteConfirm();
}, true);

// Hidden dev slider (type "dev") to tune friction deceleration.
(function(){
  let seq = '';
  window.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    seq = (seq + e.key.toLowerCase()).slice(-3);
    if (seq === 'dev') {
      let box = document.getElementById('devBox');
      if (box) { box.remove(); return; }
      box = document.createElement('div'); box.id = 'devBox';
      box.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:50;background:#141a24;border:1px solid #2a3442;border-radius:8px;padding:8px 10px;font:12px sans-serif;color:#8a97a8;display:flex;gap:8px;align-items:center';
      box.innerHTML = 'friction a <input type="range" id="devFric" min="0.5" max="8" step="0.1" value="'+FRICTION_DECEL+'"><span id="devFricV">'+FRICTION_DECEL.toFixed(1)+'</span> m/s²';
      document.body.appendChild(box);
      const s = box.querySelector('#devFric'), vlab = box.querySelector('#devFricV');
      s.addEventListener('input', () => { FRICTION_DECEL = parseFloat(s.value); vlab.textContent = FRICTION_DECEL.toFixed(1); if (!running) resetRun(); });
    }
  });
})();

// ─── Init ─────────────────────────────────────────────────────────────────────
resetRun();
requestAnimationFrame(frame);
// redraw once the hand-drawn font has loaded so canvas labels pick it up
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawScene(); drawGraph(); drawEnergy(); });
</script>
</body>
</html>
