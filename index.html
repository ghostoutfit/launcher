<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme (default) */
    --bg: #f0e6cd;
    --panel: #fbf5e9;
    --panel-2: #efe3cc;
    --ink: #262a30;
    --muted: #867c67;
    --line: #d8c7a6;
    --accent: #2d8bd4;
    --accent-2: #d9a328;
    --ground: #c7ab7a;
    /* Shared element colours (both themes) */
    --ball: #ff6b57;
    --ball2: #3b9eff;
    --boost: #4ade80;
    --cut: #ef5350;
    --fric: #e08a5a;
    --wall: #aab4c2;
    --bumper: #f06fa4;
    --target: #b98cff;
    --hand: 'Lexend', system-ui, 'Segoe UI', sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14;
    --panel: #141a24;
    --panel-2: #1b2330;
    --ink: #e7edf5;
    --muted: #8a97a8;
    --line: #2a3442;
    --accent: #3fb6ff;
    --accent-2: #ffce4a;
    --ground: #3a4656;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--hand);
    -webkit-user-select: none; user-select: none;
  }
  /* a tiny bit of sandy grain on the cream background (light mode only) */
  :root:not([data-theme="dark"]) body {
    background-image:
      radial-gradient(rgba(122,92,46,0.07) 0.8px, transparent 1.2px),
      radial-gradient(rgba(122,92,46,0.05) 0.8px, transparent 1.2px);
    background-size: 6px 6px, 9px 9px;
    background-position: 0 0, 3px 4px;
  }
  #app { max-width: 1120px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.01em; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; }

  #stage { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  #main { flex: 1; min-width: 320px; }
  #sidebar { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  #palette { padding: 11px; }

  /* Controls bar */
  #controls {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 14px;   /* sliders + buttons on one row */
    padding: 9px 16px; margin-bottom: 10px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .ctrl .row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 52px; white-space: nowrap; }
  .spacer { flex: 1; }
  .action-group { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }

  button {
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--panel-2); border: 2px solid var(--line);
    border-radius: 11px; padding: 7px 15px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06121c; border-color: #1e6fa3; }
  button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }

  /* Replay buttons: circle-arrow + turtle (half speed) / rabbit (normal speed) */
  .replay { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; }
  .replay .rsym { font-size: 20px; line-height: 1; margin-top: -2px; }
  /* icon tinted to the palette (ink) via mask, so it tracks light/dark mode */
  .replay .ricon { height: 23px; width: 28px; display: block; background: var(--ink);
    -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }

  #themeToggle {
    position: fixed; top: 14px; right: 16px; z-index: 60;
    width: 40px; height: 40px; padding: 0; border-radius: 12px; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
  }

  .toggle { display: inline-flex; border: 2px solid var(--line); border-radius: 11px; overflow: hidden; }
  .toggle button { border: none; border-radius: 0; background: transparent; padding: 7px 12px; color: var(--muted); }
  .toggle button.on { background: var(--accent-2); color: #241c00; }

  /* Mode tabs (Sandbox / Puzzle) */
  #modeTabs { margin: 0 0 10px; }
  #modeTabs button { font-size: 14px; padding: 7px 18px; font-weight: 700; }

  /* Puzzle menu */
  #puzzlePanel { margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
  .pzLabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
  .pzRow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .pzBtn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 6px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel-2); cursor: pointer; position: relative; min-height: 58px; justify-content: center;
  }
  .pzBtn .pzName { font-size: 12px; font-weight: 700; color: var(--ink); text-align: center; line-height: 1.1; }
  .pzBtn .pzStars { font-size: 12px; color: var(--accent-2); letter-spacing: 1px; }
  .pzBtn.locked { opacity: 0.5; cursor: not-allowed; }
  .pzBtn.locked .pzName { color: var(--muted); }
  .pzBtn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
  .pzBtn.solved { border-color: var(--boost); }
  .pzBtn .pzMark { position: absolute; top: 4px; right: 6px; font-size: 11px; }
  .pzBtn.solved .pzMark { color: var(--boost); }

  #puzzleStatus { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 14px; }
  #puzzleStatus .psName { font-weight: 800; }
  #puzzleStatus .psStars { color: var(--accent-2); letter-spacing: 1px; }
  #puzzleStatus .psGoal { color: var(--muted); }
  #puzzleStatus .psSolved { color: var(--boost); font-weight: 800; }
  @media (max-width: 720px) { .pzRow { grid-template-columns: repeat(3, 1fr); } }
  /* the hidden attribute must win over the display rules above */
  #graphTabs[hidden], #puzzlePanel[hidden], #puzzleStatus[hidden] { display: none; }

  /* Scene */
  #sceneWrap { padding: 0; margin-bottom: 10px; overflow: hidden; }
  #scene { display: block; width: 100%; height: 188px; touch-action: none; }

  /* Graph */
  #graphCard { padding: 10px 14px 12px; }
  #graphTabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #graphTabs button { padding: 7px 12px; font-size: 13px; }
  #graphTabs button.active { background: var(--accent); color: #06121c; border-color: var(--accent); }
  #graphRow { display: flex; gap: 14px; align-items: stretch; }
  #graphPlot { position: relative; flex: 1 1 auto; min-width: 0; }
  #graph { display: block; width: 100%; height: 250px; }
  @media (max-width: 720px) { #sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; } #sidebar > .panel { flex: 1 1 240px; } }

  /* Palette */
  .ptitle { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 9px; margin-bottom: 6px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--panel-2); cursor: grab;
  }
  .chip:active { cursor: grabbing; }
  .chip.disabled { cursor: not-allowed; pointer-events: none; }
  .chip.ball2.disabled .ico { color: var(--muted); }
  .chip.ball2.disabled .ctxt b { color: var(--muted); }
  .chip .ico { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #1a2230; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .chip.boost .ico { background: var(--boost); color: #063; }
  .chip.friction .ico { background: var(--fric); color: #3a1c08; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 6px); }
  .chip.wall .ico { background: var(--wall); color: #1c242e; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 4px, transparent 4px 8px); }
  .chip.target .ico { background: var(--target); color: #231141; font-size: 16px; }
  .chip.ball2 .ico { background: #1c2430; color: var(--ball2); font-size: 18px; }
  .chip .ctxt { font-size: 14px; line-height: 1.2; }
  .chip .ctxt b { display: block; font-size: 15px; }
  .chip .ctxt span { color: var(--muted); font-size: 12.5px; }
  #palette .phint { color: var(--muted); font-size: 13px; line-height: 1.35; margin: 6px 0 12px; }

  #tip {
    position: fixed; z-index: 90; pointer-events: none; max-width: 220px; display: none;
    background: var(--ink); color: var(--panel, #fff); border-radius: 8px; padding: 6px 10px;
    font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  #dragGhost {
    position: fixed; z-index: 100; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0.92;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }

  /* Delete-confirm popover */
  #deleteConfirm {
    position: fixed; z-index: 210; width: 190px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    display: flex; flex-direction: column; gap: 10px;
  }
  #deleteConfirm[hidden] { display: none; }
  #deleteConfirm .dc-msg { font-size: 12px; color: var(--ink); line-height: 1.35; }
  #deleteConfirm .dc-btns { display: flex; gap: 8px; }
  #deleteConfirm .dc-btns button { flex: 1; padding: 7px; font-size: 12px; }
  #deleteConfirm .dc-btns button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <button id="themeToggle" aria-label="Toggle light/dark">🌙</button>
  <h1>LAUNCHER</h1>
  <div class="sub">Launch a ball along flat ground, drop track pieces in its path, and watch the motion graph build live.</div>

  <div id="modeTabs" class="toggle" data-tip="Sandbox: build any track. Puzzle: match a target graph.">
    <button data-mode="sandbox" class="on">Sandbox</button>
    <button data-mode="puzzle">Puzzle</button>
  </div>

  <div id="stage">
    <div id="main">
      <div id="controls" class="panel">
        <div class="ctrl" data-tip="Where the ball starts (0–15 m).">
          <label>Launch position</label>
          <div class="row">
            <input type="range" id="pos" min="0" max="15" step="1" value="0">
            <span class="val" id="posVal">0 m</span>
          </div>
        </div>
        <div class="ctrl" data-tip="How fast the ball starts, going right (0–12 m/s).">
          <label>Launch speed</label>
          <div class="row">
            <input type="range" id="speed" min="0" max="12" step="1" value="6">
            <span class="val" id="speedVal">6 m/s</span>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="action-group">
          <button id="launchBtn" class="primary" data-tip="Release the ball. The run records for 5 s, or until the ball leaves the screen.">Launch</button>
          <button id="replaySlowBtn" class="replay" data-tip="Replay the last run at half speed." disabled><span class="rsym">&#8634;</span><span class="ricon" role="img" aria-label="replay half speed"></span></button>
          <button id="replayFastBtn" class="replay" data-tip="Replay the last run at normal speed." disabled><span class="rsym">&#8634;</span><span class="ricon" role="img" aria-label="replay normal speed"></span></button>
          <button id="resetBtn" data-tip="Clear the run and graph and put the ball back at its start.">Reset</button>
          <button id="clearBtn" data-tip="Remove every track piece.">Clear</button>
        </div>
      </div>

      <div id="sceneWrap" class="panel">
        <canvas id="scene"></canvas>
      </div>

      <div id="puzzlePanel" class="panel" hidden>
        <div class="pzGroup">
          <div class="pzLabel">Position graphs</div>
          <div class="pzRow" id="pzPosRow"></div>
        </div>
        <div class="pzGroup">
          <div class="pzLabel">Velocity graphs</div>
          <div class="pzRow" id="pzVelRow"></div>
        </div>
      </div>

      <div id="graphCard" class="panel">
        <div id="graphTabs" data-tip="Choose which graph to show.">
          <button data-g="position" class="active">Position–time</button>
          <button data-g="velocity">Velocity–time</button>
          <button data-g="both">Both Position and Velocity</button>
        </div>
        <div id="puzzleStatus" hidden></div>
        <div id="graphRow">
          <div id="graphPlot">
            <canvas id="graph" data-tip="Motion graph: each ball's position or velocity against time."></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="palette" class="panel">
        <div class="ptitle">Track pieces</div>
        <div class="chip boost" data-piece="boost">
          <div class="ico">±</div>
          <div class="ctxt"><b>Speed change</b></div>
        </div>
        <div class="chip target" data-piece="target">
          <div class="ico">⇄</div>
          <div class="ctxt"><b>Target speed</b></div>
        </div>
        <div class="chip friction" data-piece="friction">
          <div class="ico">▦</div>
          <div class="ctxt"><b>Friction patch</b></div>
        </div>
        <div class="chip wall" data-piece="wall">
          <div class="ico">█</div>
          <div class="ctxt"><b>Wall</b></div>
        </div>
        <div class="chip ball2" data-piece="ball2">
          <div class="ico">●</div>
          <div class="ctxt"><b>Second ball</b></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="deleteConfirm" hidden>
  <div class="dc-msg">Delete this <span id="dcName">piece</span>?</div>
  <div class="dc-btns">
    <button id="dcCancel">Cancel</button>
    <button id="dcDelete" class="danger">Delete</button>
  </div>
</div>

<div id="tip"></div>
<script>
// ─── Model constants (metres, seconds, m/s) ───────────────────────────────────
const TRACK_LEN = 20;
const BALL_R    = 0.28;
const WALL_HW   = 0.25;       // wall half-thickness (m) — drawn width is 2*WALL_HW
const BALL_VR   = 0.35;       // drawn ball radius (m)
// A wall's x is where the BALL'S CENTER sits when it hits from the left (always an integer, since
// x snaps to 1 m). The wall body stands WALL_D further right, so the ball touches its face
// instead of overlapping it. From the right the ball stops at x + 2*WALL_D.
const WALL_D    = WALL_HW + BALL_VR;
let   FRICTION_DECEL = 5;     // deceleration under friction (m/s^2) — dev-tunable
const BOOST_DV  = 4;          // speed change pad: starting value (m/s); the pad's ± buttons step it by TARGET_STEP
const FRIC_LEN  = 2;          // friction patch length (m)
const TARGET_STEP = 2;        // target-speed increment (m/s)
const TARGET_MAX  = 12;       // max target-speed magnitude (m/s)
const MAX_TIME  = 60;         // hard safety cap (s)
const RUN_TIME_CAP = 5;       // everything stops when the 5 s graph window is filled
const MASS      = 1;          // kg (KE = ½·m·v²)

// ─── State ────────────────────────────────────────────────────────────────────
let v0 = 6, launchX = 0, graphType = 'position';
let playbackRate = 1;           // 1 = normal (rabbit), 0.5 = half speed (turtle)
let lastRun = null;             // { v0, x0 } of the last launch, so replay repeats it
let mode = 'sandbox';           // 'sandbox' | 'puzzle'
let currentPuzzle = null;       // the selected puzzle object in puzzle mode
let puzzleGraded = false;       // whether the current run has been graded against the puzzle
let replaying = false;          // true during a replay: show the full stored curve + a moving marble
let lastTrace = null;           // [{color, samples}] — the completed run kept on screen during replay
let runCaptured = false;        // whether lastTrace has been captured for the current (fresh) run
let running = false, ballStopped = false, t = 0;
let v = 0, x = 0;             // live state of whichever ball is currently moving
let balls = [];              // every ball: {launcher, x, v, moving, color, d, samples:[{t,x,v,d}]}
let movingBall = null;       // the one ball currently in motion (null when all at rest)
let heldGate = null;         // a timed target holding the ball in its tube until its trigger time
let lastFrame = 0;

const ke = () => 0.5 * MASS * v * v;

// Fixed graph axes (always from zero). Position is always 0–20 m.
const AXES = {
  position: { t: 5, y: 20 },
  velocity: { t: 5, y: 12 },
  both: { t: 5, yv: 12, yd: 20 },   // velocity (left axis) + distance (right axis)
};

// Placed track pieces
let boosts = [];             // {id, x, dv, used}  — speed change pad (dv may be + or −)
let fricZones = [];          // {id, x, len}
let walls = [];              // {id, x, bouncy}  — x is the ball's contact position (see WALL_D)
let targets = [];            // {id, x, mag, dir, time, used}  — target-speed gates
let secondBalls = [];        // {id, x}  — stationary balls that get hit (equal-mass swap)
let pieceId = 1;

// Drag state
let drag = null;             // { kind:'new'|'move', piece, el?, ghost? }
let lastClick = null;        // { el, time } — used to detect a double-click on a piece
let confirmPiece = null;     // { piece, el } awaiting delete confirmation

// ─── Elements ─────────────────────────────────────────────────────────────────
const sceneC = document.getElementById('scene');
const sx = sceneC.getContext('2d');
const graphC = document.getElementById('graph');
const gx = graphC.getContext('2d');
const speedEl = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const posEl = document.getElementById('pos');
const posVal = document.getElementById('posVal');
const launchBtn = document.getElementById('launchBtn');
const replaySlowBtn = document.getElementById('replaySlowBtn');
const replayFastBtn = document.getElementById('replayFastBtn');

// ─── Scene geometry ───────────────────────────────────────────────────────────
const PAD_L = 24, PAD_R = 24;
function sceneDims() { return { w: sceneC.clientWidth, h: sceneC.clientHeight }; }
function groundY() { return sceneDims().h - 56; }   // surface line; solid ground fills below it
function ballRadius() { const { w } = sceneDims(); return Math.max(12, (BALL_R / TRACK_LEN) * (w - PAD_L - PAD_R) * 1.25); }
function mToPx(m) { const { w } = sceneDims(); return PAD_L + (m / TRACK_LEN) * (w - PAD_L - PAD_R); }
function pxToM(pxX) { const { w } = sceneDims(); return clamp(((pxX - PAD_L) / (w - PAD_L - PAD_R)) * TRACK_LEN, 0, TRACK_LEN); }
function clamp(a, lo, hi) { return Math.max(lo, Math.min(hi, a)); }

// ─── Physics (numerical integration) ──────────────────────────────────────────
function onFrictionZone(px) { return fricZones.some(z => px >= z.x && px <= z.x + z.len); }

// A piece at px is crossed when the ball moves from a to b through it (either direction).
function crossed(px, a, b) { return (px > a && px <= b) || (px < a && px >= b); }
function firstCrossed(arr, a, b, activeOnly) {
  let hit = null;
  for (const p of arr) {
    if (activeOnly && p.used) continue;
    if (crossed(p.x, a, b) && (!hit || Math.abs(p.x - a) < Math.abs(hit.x - a))) hit = p;
  }
  return hit;
}
// Nearest wall face the ball's center reaches between a and b → { wall, cp } (cp = center at contact).
function firstWallHit(a, b) {
  const s = Math.sign(b - a); if (!s) return null;
  let hit = null;
  for (const wall of walls) {
    const cp = s > 0 ? wall.x : wall.x + 2 * WALL_D;
    if (crossed(cp, a, b) && (!hit || Math.abs(cp - a) < Math.abs(hit.cp - a))) hit = { wall, cp };
  }
  return hit;
}
// Nearest resting ball the moving ball reaches between a and b. Contact is when the
// centers are one diameter apart, so the contact point sits just short of the ball.
function firstBallHit(a, b) {
  const s = Math.sign(b - a); if (!s) return null;
  let hit = null;
  for (const ball of balls) {
    if (ball === movingBall || ball.moving) continue;
    const cp = ball.x - s * 2 * BALL_R;
    if (crossed(cp, a, b) && (!hit || Math.abs(cp - a) < Math.abs(hit.cp - a))) hit = { ball, cp };
  }
  return hit;
}

function step(dt) {
  const sub = 6, h = dt / sub;
  for (let i = 0; i < sub && !ballStopped; i++) {
    // friction opposes motion (works in either direction)
    const decel = onFrictionZone(x) ? FRICTION_DECEL : 0;
    if (decel > 0 && v !== 0) {
      const s = Math.sign(v), nv = v - s * decel * h;
      v = (Math.sign(nv) !== s) ? 0 : nv;
    }
    if (Math.abs(v) <= 1e-4) { v = 0; ballStopped = true; break; }
    const nx = x + v * h;
    // wall: the ball's center reaches the wall face (x going right, x + 2*WALL_D going left).
    // Plain walls stop it dead; bouncy walls reflect it at the same speed.
    const wh = firstWallHit(x, nx);
    if (wh) {
      x = wh.cp;
      if (wh.wall.bouncy) { v = -v; continue; }
      v = 0; ballStopped = true; break;
    }
    // second ball: equal-mass elastic hit → this ball stops dead, the other takes its speed
    const hit = firstBallHit(x, nx);
    if (hit) {
      movingBall.x = hit.cp; movingBall.v = 0; movingBall.moving = false;  // incoming ball stops, touching
      hit.ball.moving = true; hit.ball.v = v;                              // struck ball takes the speed
      movingBall = hit.ball;
      x = hit.ball.x;                        // keep v; continue as the struck ball
      continue;
    }
    // target-speed gate
    const g = firstCrossed(targets, x, nx, true);
    if (g) {
      if (g.time != null && t < g.time) {       // too early → the tube holds the ball until its time
        x = g.x; v = 0; ballStopped = true; heldGate = g; break;
      }
      x = g.x;
      const vNew = g.dir * g.mag;
      v = vNew; g.used = true; g._shake = 1;    // kick off the tube's shake
      continue;
    }
    // speed change pad (+ΔV or −ΔV)
    const b = firstCrossed(boosts, x, nx, true);
    if (b) { x = b.x; v += b.dv; b.used = true; b._shake = 1; continue; }
    x = nx;
    // the right/left edges are NOT walls: let the ball coast offscreen and keep going
  }
}

// ─── Run control ──────────────────────────────────────────────────────────────
// Build the ball set: the red launcher at 0, then the blue second balls where placed.
function buildBalls(launchV, x0) {
  balls = [{ launcher: true, x: x0 || 0, v: launchV, moving: false, color: getCss('--ball'), d: 0, samples: [] }];
  for (const b of secondBalls) balls.push({ launcher: false, x: b.x, v: 0, moving: false, color: getCss('--ball2'), d: 0, samples: [] });
}
function seedSamples() { for (const b of balls) b.samples = [{ t: 0, x: b.x, v: b.v, d: 0 }]; }
// Snapshot the current trajectories as the static curve to keep on screen during
// replay, flat-extended to the right edge so the curve spans the whole time axis.
function snapshotTrace(extend = true) {
  return balls.map(b => {
    const s = b.samples.slice();
    const last = s[s.length - 1];
    if (extend && last && last.t < RUN_TIME_CAP) s.push({ t: RUN_TIME_CAP, x: last.x, v: last.v, d: last.d });
    return { color: b.color, samples: s };
  });
}

// Run the ball from (xLaunch, vLaunch) played back at `rate` (1 = normal, 0.5 = half).
function doLaunch(vLaunch, xLaunch, rate, isReplay) {
  v0 = vLaunch; launchX = xLaunch; playbackRate = rate;
  replaying = !!isReplay; runCaptured = false; puzzleGraded = false;
  boosts.forEach(b => { b.used = false; b._shake = 0; });
  targets.forEach(g => { g.used = false; g._shake = 0; });
  heldGate = null;
  buildBalls(v0, launchX);
  movingBall = balls[0]; movingBall.moving = true;
  running = true; ballStopped = false; t = 0; x = launchX; v = v0;
  seedSamples();
  lastFrame = performance.now();
  launchBtn.disabled = true;
  lastRun = { v0, x0: launchX };
  replaySlowBtn.disabled = false; replayFastBtn.disabled = false;
}
function launch() { doLaunch(parseInt(speedEl.value, 10), parseInt(posEl.value, 10), 1, false); }
// Replay repeats the last run exactly, at the given rate, keeping the finished
// graph on screen with a marble running along it.
function replay(rate) {
  if (!lastRun) return;
  if (!lastTrace) lastTrace = snapshotTrace();
  doLaunch(lastRun.v0, lastRun.x0, rate, true);
}

function resetRun() {
  launchX = posEl ? parseInt(posEl.value, 10) : 0;
  running = false; replaying = false; lastTrace = null; runCaptured = false;
  ballStopped = false; t = 0; x = launchX; v = 0;
  targets.forEach(g => g._shake = 0); boosts.forEach(b => b._shake = 0);
  heldGate = null;
  buildBalls(0, launchX); movingBall = null;
  launchBtn.disabled = false;
  drawScene(); drawGraph();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function frame(now) {
  if (running) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000) * playbackRate;
    lastFrame = now;
    t += dt;
    // a timed tube that's been holding the ball shoots it out at its trigger time
    if (heldGate && t >= heldGate.time) {
      v = heldGate.dir * heldGate.mag;
      heldGate.used = true; heldGate._shake = 1;
      ballStopped = false; if (movingBall) movingBall.moving = true;
      heldGate = null;
    }
    if (!ballStopped) step(dt);           // the moving ball halts at a wall, but time marches on
    if (movingBall) { movingBall.x = x; movingBall.v = v; if (ballStopped) movingBall.moving = false; }
    for (const el of [...targets, ...boosts]) { if (el._shake) { el._shake *= 0.85; if (el._shake < 0.02) el._shake = 0; } }
    // record every ball's trajectory so each can be graphed on the same axes
    for (const b of balls) {
      const prev = b.samples[b.samples.length - 1];
      b.d = prev.d + Math.abs(b.x - prev.x);
      b.samples.push({ t, x: b.x, v: b.v, d: b.d });
    }
    if (mode === 'puzzle' && !replaying) gradePuzzle();
    // marble left the screen: stop collecting data and freeze the graph where it ended
    // (no flat extension), leaving the replay buttons ready
    if (x > TRACK_LEN || x < 0) {
      running = false; launchBtn.disabled = false;
      replaySlowBtn.disabled = false; replayFastBtn.disabled = false;
      if (!replaying) { lastTrace = snapshotTrace(false); runCaptured = true; }
    } else {
      // free to relaunch once the ball is truly at rest (not merely held by a tube)
      if (ballStopped && !heldGate) {
        launchBtn.disabled = false;
        // once a fresh run's motion is done, keep its curve so replay can re-trace it
        if (!replaying && !runCaptured) { lastTrace = snapshotTrace(); runCaptured = true; }
      }
      // run ends when the graph's time axis is filled (safety cap otherwise)
      if (t >= RUN_TIME_CAP || t >= MAX_TIME) {
        running = false; launchBtn.disabled = false;
        if (!replaying) { lastTrace = snapshotTrace(); runCaptured = true; }
      }
    }
    drawScene(); drawGraph();
  }
  requestAnimationFrame(frame);
}

// ─── Scene rendering ──────────────────────────────────────────────────────────
function fit(c) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  return { w, h, dpr };
}

function drawScene() {
  const { w, h, dpr } = fit(sceneC);
  sx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sx.clearRect(0, 0, w, h);
  const gY = groundY();

  // ground — a solid mass below the surface, with a lighter top soil band (cel-shaded depth)
  const groundCol = getCss('--ground');
  sx.fillStyle = darken(groundCol, 0.12); sx.fillRect(0, gY, w, h - gY);
  sx.fillStyle = lighten(groundCol, 0.14); sx.fillRect(0, gY, w, 7);           // surface soil

  // friction patches — rough ground SET INTO the surface (sits below it, not on top)
  const fricCol = getCss('--fric'), FD = 26;
  for (const z of fricZones) {
    const xa = mToPx(z.x), xb = mToPx(Math.min(TRACK_LEN, z.x + z.len)), w2 = xb - xa;
    sx.fillStyle = fricCol; sx.fillRect(xa, gY, w2, FD);
    sx.fillStyle = darken(fricCol, 0.2); sx.fillRect(xa, gY + FD * 0.58, w2, FD * 0.42);  // shade block
    // gritty speckles
    sx.save(); sx.beginPath(); sx.rect(xa, gY, w2, FD); sx.clip();
    sx.fillStyle = darken(fricCol, 0.45);
    for (let px = xa + 6; px < xb - 2; px += 9) for (let r2 = 0; r2 < 2; r2++) {
      const py = gY + 8 + r2 * 9 + (Math.floor(px) % 2 ? 0 : 4);
      sx.beginPath(); sx.arc(px + r2 * 4, py, 1.5, 0, 7); sx.fill();
    }
    sx.restore();
    // side + bottom outline (the top edge is the surface line, stroked below)
    ink(2.5); sx.beginPath(); sx.moveTo(xa, gY); sx.lineTo(xa, gY + FD); sx.lineTo(xb, gY + FD); sx.lineTo(xb, gY); sx.stroke();
    // end grips (resize handles)
    sx.fillStyle = lighten(fricCol, 0.25);
    roundRect(sx, xa - 3, gY - 3, 6, FD + 6, 3); sx.fill(); ink(2); sx.stroke();
    roundRect(sx, xb - 3, gY - 3, 6, FD + 6, 3); sx.fill(); ink(2); sx.stroke();
    z._sign = drawPieceSign((xa + xb) / 2, gY, 'friction', fricCol, '#4a2410', Math.round(z.len) + 'm');
  }

  // the surface line itself — bold, the ball rolls along here
  ink(3); sx.beginPath(); sx.moveTo(0, gY); sx.lineTo(w, gY); sx.stroke();

  // distance ticks + labels (down in the ground)
  sx.font = handFont(13, 600); sx.textAlign = 'center';
  for (let m = 0; m <= TRACK_LEN; m += 5) {
    const gxp = mToPx(m);
    ink(1.5); sx.beginPath(); sx.moveTo(gxp, gY); sx.lineTo(gxp, gY + 8); sx.stroke();
    sx.fillStyle = getCss('--ink'); sx.fillText(m + ' m', gxp, gY + 24);
  }

  // speed change pads: green when adding speed (+dv), red when removing it (−dv)
  for (const b of boosts) drawPad(b, getCss(b.dv < 0 ? '--cut' : '--boost'), b.dv < 0 ? '#4a0a0a' : '#06381f', b.dv < 0 ? '−' : '+');

  // target-speed launchers — draw the sign here; the tube is drawn after the balls
  const tCol = getCss('--target');
  for (const g of targets) {
    const gx2 = mToPx(g.x), timed = g.time != null;
    const r = ballRadius(), L = 2.9 * r, H = 2 * r + 8;
    const tcy = gY - r, tubeTop = tcy - H / 2;
    g._tube = { cx: gx2, cy: tcy, L, H, top: tubeTop };

    // the sign (fixed size), on a post down to the tube
    const sw = 112, sh = 82, sbot = tubeTop - 6, sTop = sbot - sh, X = gx2 - sw / 2, Y = sTop;
    signPost(gx2, sbot, tubeTop + 2, tCol);
    panel3D(X, Y, sw, sh, 12, tCol);
    sx.textAlign = 'center'; sx.textBaseline = 'middle';

    // Row A — direction (arrows only)
    const dirW = 35, dirH = 22, dAy = Y + 7;
    const dirL = { x: X + 6, y: dAy, w: dirW, h: dirH }, dirR = { x: X + sw - 6 - dirW, y: dAy, w: dirW, h: dirH };
    for (const [z, on, arr] of [[dirL, g.dir < 0, '◀'], [dirR, g.dir > 0, '▶']]) {
      sx.fillStyle = on ? lighten(tCol, 0.5) : darken(tCol, 0.1);
      roundRect(sx, z.x, z.y, z.w, z.h, 6); sx.fill(); ink(1.6); sx.stroke();
      sx.fillStyle = on ? INK : lighten(tCol, 0.3);
      sx.font = handFont(14, 700);
      sx.fillText(arr, z.x + z.w / 2, z.y + z.h / 2 + 1);
    }

    // Row B — speed stepper (m/s next to the number)
    const sy = Y + 46;
    const minus = miniBtn(X + 14, sy, 9, '–', tCol, INK);
    const plus  = miniBtn(X + sw - 14, sy, 9, '+', tCol, INK);
    sx.fillStyle = '#fff'; sx.textBaseline = 'middle';
    sx.font = handFont(20, 800); const nw = sx.measureText('' + g.mag).width;
    sx.font = handFont(11, 600); const uw = sx.measureText(' m/s').width;
    const gx0 = gx2 - (nw + uw) / 2; sx.textAlign = 'left';
    sx.font = handFont(20, 800); sx.fillText(g.mag, gx0, sy);
    sx.font = handFont(11, 600); sx.fillText(' m/s', gx0 + nw, sy + 1);
    sx.textAlign = 'center';

    // Row C — timer (clock to add; just the number once a time is set)
    const cy = Y + sh - 13;
    let tMinus = null, tPlus = null, tToggle = null;
    if (!timed) {
      drawClock(gx2, cy, 8, lighten(tCol, 0.5));
      tToggle = { x: gx2 - 12, y: cy - 12, w: 24, h: 24 };
    } else {
      tMinus = miniBtn(X + 14, cy, 7, '–', darken(tCol, 0.05), '#fff');
      tPlus  = miniBtn(X + sw - 14, cy, 7, '+', darken(tCol, 0.05), '#fff');
      // clock icon stays beside the whole-second value; tap the pair to clear the timer
      const ts = '@ ' + Math.round(g.time) + 's';
      sx.font = handFont(15, 700); const tw = sx.measureText(ts).width;
      const gw = 16 + 5 + tw, cx0 = gx2 - gw / 2;
      drawClock(cx0 + 8, cy, 8, lighten(tCol, 0.5));
      sx.fillStyle = '#fff'; sx.textAlign = 'left'; sx.fillText(ts, cx0 + 21, cy + 1); sx.textAlign = 'center';
      tToggle = { x: cx0 - 3, y: cy - 11, w: gw + 6, h: 22 };
    }

    sx.textBaseline = 'alphabetic';
    g._ui = { bounds: { x: X, y: Y, w: sw, h: sh }, gx: gx2, gTop: tubeTop,
              tube: { x: gx2 - L / 2, y: tubeTop, w: L, h: H },
              dirL, dirR, minus, plus, tMinus, tPlus, tToggle, timed };
  }

  // walls — a chunky brick wall standing on the surface (pink = bouncy)
  for (const wl of walls) {
    const wallCol = getCss(wl.bouncy ? '--bumper' : '--wall');
    const ppm = (sceneDims().w - PAD_L - PAD_R) / TRACK_LEN;
    const wx = mToPx(wl.x + WALL_D), ww = Math.max(14, 2 * WALL_HW * ppm), wT = gY - 48, wh = gY - wT, wl0 = wx - ww / 2;
    roundRect(sx, wl0, wT, ww, wh, 5); sx.fillStyle = wallCol; sx.fill();
    // flat shade block down the right third
    sx.save(); roundRect(sx, wl0, wT, ww, wh, 5); sx.clip();
    sx.fillStyle = darken(wallCol, 0.2); sx.fillRect(wl0 + ww * 0.66, wT, ww * 0.34, wh);
    // brick courses (offset every other row)
    sx.strokeStyle = INK; sx.lineWidth = 1.8; sx.lineCap = 'round';
    let row = 0;
    for (let yb = wT + 9; yb < gY; yb += 9) {
      sx.beginPath(); sx.moveTo(wl0, yb); sx.lineTo(wl0 + ww, yb); sx.stroke();
      const jx = wx + (row % 2 ? -ww / 4 : ww / 4);
      sx.beginPath(); sx.moveTo(jx, yb); sx.lineTo(jx, yb - 9); sx.stroke();
      row++;
    }
    sx.restore();
    roundRect(sx, wl0, wT, ww, wh, 5); ink(2.5); sx.stroke();
    wl._sign = drawPieceSign(wx, wT, wl.bouncy ? 'bouncy wall' : 'wall', wallCol, '#1c242e');
  }

  // launch marker
  sx.strokeStyle = 'rgba(255,255,255,0.22)'; sx.setLineDash([5, 5]); sx.lineWidth = 1.5; sx.lineCap = 'round';
  sx.beginPath(); sx.moveTo(mToPx(0), gY - 70); sx.lineTo(mToPx(0), gY); sx.stroke();
  sx.setLineDash([]);

  // all balls, each in its own colour (resting ones drawn first, mover on top)
  for (const b of balls) if (!b.moving) drawBall(mToPx(b.x), gY, b.color);
  for (const b of balls) if (b.moving) drawBall(mToPx(b.x), gY, b.color);

  // target tubes drawn over the balls (so a ball sits fully inside); jiggle when fired
  for (const g of targets) {
    const u = g._tube; if (!u) continue;
    let jx = 0, jy = 0;
    if (running && g._shake > 0.02) { jx = (Math.random() * 2 - 1) * 8 * g._shake; jy = (Math.random() * 2 - 1) * 5 * g._shake; }
    drawTube(u.cx + jx, u.cy + jy, u.L, u.H, tCol);
  }
}

// A push pad (speed change, +dv or −dv): a pad on the ground + a sign whose +/- row sits above the
// value. The pad jiggles (half the target's shake) when it fires. sgn is '+' or '−'.
function drawPad(el, col, fgDark, sgn) {
  const gY = groundY();
  const bx = mToPx(el.x), padW = 40, padH = 15, top = gY - padH;
  let jx = 0, jy = 0;
  if (running && el._shake > 0.02) { jx = (Math.random() * 2 - 1) * 4 * el._shake; jy = (Math.random() * 2 - 1) * 2.5 * el._shake; }
  const pxc = bx + jx, pyt = top + jy;
  panelShaded(pxc - padW / 2, pyt, padW, padH, 6, col);
  ink(2.6);
  for (let k = 0; k < 3; k++) {
    const cxp = pxc - 11 + k * 10;
    sx.beginPath(); sx.moveTo(cxp - 4, pyt + 4); sx.lineTo(cxp + 4, pyt + padH / 2); sx.lineTo(cxp - 4, pyt + padH - 4); sx.stroke();
  }
  // sign: three rows — big +/−, the value, then the − / + buttons (own row so the value never covers them)
  const bw = 86, bh = 62, bbot = top - 12, BY = bbot - bh, BX = bx - bw / 2;
  signPost(bx, bbot, top, col);
  panelShaded(BX, BY, bw, bh, 11, col);
  // Row 1 — a big + or −
  sx.fillStyle = fgDark; sx.textAlign = 'center'; sx.textBaseline = 'middle';
  sx.font = handFont(24, 800); sx.fillText(sgn, bx, BY + 13);
  // Row 2 — value m/s;  Row 3 — (− button) … (+ button)
  const minus = miniBtn(BX + 13, BY + 49, 9, '–', col, INK);
  const plus  = miniBtn(BX + bw - 13, BY + 49, 9, '+', col, INK);
  sx.fillStyle = fgDark;
  const dvTxt = (el.dv < 0 ? '−' : '+') + Math.abs(el.dv);
  sx.font = handFont(15, 800); const nw = sx.measureText(dvTxt).width;
  sx.font = handFont(10, 700); const uw = sx.measureText(' m/s').width;
  const gx0 = bx - (nw + uw) / 2; sx.textAlign = 'left';
  sx.font = handFont(15, 800); sx.fillText(dvTxt, gx0, BY + 33);
  sx.font = handFont(10, 700); sx.fillText(' m/s', gx0 + nw, BY + 33);
  sx.textAlign = 'center'; sx.textBaseline = 'alphabetic';
  el._ui = { minus, plus };
  el._sign = { x: BX, y: BY, w: bw, h: bh };
}

// A flat cartoon ball on the ground line at gY: solid fill, flat shade block, bold outline, shine.
function drawBall(bx, gY, ballCol) {
  const r = ballRadius();
  const cyb = gY - r;
  sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); sx.fillStyle = ballCol; sx.fill();
  // flat shade crescent (a darker offset disc clipped to the ball)
  sx.save(); sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); sx.clip();
  sx.fillStyle = darken(ballCol, 0.22);
  sx.beginPath(); sx.arc(bx + r * 0.42, cyb + r * 0.42, r, 0, Math.PI * 2); sx.fill();
  sx.restore();
  sx.beginPath(); sx.arc(bx, cyb, r, 0, Math.PI * 2); ink(2.5); sx.stroke();
  // flat round highlight
  sx.fillStyle = 'rgba(255,255,255,0.92)';
  sx.beginPath(); sx.arc(bx - r * 0.34, cyb - r * 0.34, r * 0.17, 0, 7); sx.fill();
}

// A small marble (same shaded style as the ball) for graph start-value markers.
function drawMarbleAt(c, cx, cy, r, col) {
  c.save();
  c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fillStyle = col; c.fill();
  c.save(); c.beginPath(); c.arc(cx, cy, r, 0, 7); c.clip();
  c.fillStyle = darken(col, 0.22);
  c.beginPath(); c.arc(cx + r * 0.42, cy + r * 0.42, r, 0, 7); c.fill();
  c.restore();
  c.beginPath(); c.arc(cx, cy, r, 0, 7); c.lineWidth = 1.8; c.strokeStyle = INK; c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.92)';
  c.beginPath(); c.arc(cx - r * 0.34, cy - r * 0.34, r * 0.17, 0, 7); c.fill();
  c.restore();
}

// ─── Graph rendering ──────────────────────────────────────────────────────────
function graphSpec() {
  if (graphType === 'position') return { key: 'x', label: 'Position', unit: 'm' };
  return { key: 'v', label: 'Velocity', unit: 'm/s' };
}

function drawGraph() {
  const both = graphType === 'both';
  const { w, h, dpr } = fit(graphC);
  gx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gx.clearRect(0, 0, w, h);
  const base = AXES[graphType];
  const tMax = base.t;
  const padL = 52, padR = 16, padB = 34;
  const x0 = padL, x1 = w - padR;
  const X = tt => x0 + (tt / tMax) * (x1 - x0);

  // Draw one metric's plot (own y-axis + own time numbers) into the band [ty, by].
  // opts.caption adds the "time (s)" label; opts.vgrid adds vertical time gridlines
  // bounded to this panel (so stacked panels stay separate, not seamless).
  function drawPanel(metric, ty, by, opts) {
    opts = opts || {};
    const yMax = metric.yMax;
    const Y = vv => by + (vv / yMax) * (ty - by);

    // vertical time gridlines (integer seconds), kept within this panel
    if (opts.vgrid) {
      gx.strokeStyle = getCss('--line'); gx.lineWidth = 1;
      for (let tt = 0; tt <= tMax + 1e-9; tt += 1) {
        const xx = X(tt); gx.beginPath(); gx.moveTo(xx, ty); gx.lineTo(xx, by); gx.stroke();
      }
    }

    // horizontal gridlines + y-axis labels
    gx.font = handFont(13, 400); gx.lineWidth = 1;
    gx.textAlign = 'right'; gx.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const vv = (yMax * i) / 5, yy = Y(vv);
      gx.strokeStyle = getCss('--line'); gx.beginPath(); gx.moveTo(x0, yy); gx.lineTo(x1, yy); gx.stroke();
      gx.fillStyle = getCss('--muted'); gx.fillText(vv.toFixed(yMax < 4 ? 1 : 0), x0 - 8, yy);
    }

    // time axis: major ticks every 1 s (labelled) + minor ticks every 0.5 s
    gx.strokeStyle = getCss('--line'); gx.fillStyle = getCss('--muted');
    gx.textAlign = 'center'; gx.textBaseline = 'top';
    for (let tt = 0; tt <= tMax + 1e-9; tt += 0.5) {
      const xx = X(tt), major = Math.abs(tt - Math.round(tt)) < 1e-9;
      gx.lineWidth = 1; gx.beginPath(); gx.moveTo(xx, by); gx.lineTo(xx, by + (major ? 6 : 3)); gx.stroke();
      if (major) gx.fillText(tt.toFixed(0), xx, by + 9);
    }
    if (opts.caption) { gx.fillStyle = getCss('--muted'); gx.fillText('time (s)', (x0 + x1) / 2, by + 22); }

    // y-axis title
    gx.save(); gx.translate(14, (ty + by) / 2); gx.rotate(-Math.PI / 2);
    gx.textAlign = 'center'; gx.textBaseline = 'bottom';
    gx.fillStyle = getCss('--muted'); gx.fillText(metric.label + ' (' + metric.unit + ')', 0, 0); gx.restore();

    // traces (clipped to the plot area). During replay the full completed curve
    // stays on screen (lastTrace) instead of rebuilding as the ball re-runs.
    const traces = (replaying && lastTrace) ? lastTrace : balls;
    gx.save(); gx.beginPath(); gx.rect(x0, ty, x1 - x0, by - ty); gx.clip();
    gx.lineWidth = 2.4; gx.lineJoin = 'round'; gx.lineCap = 'round';
    for (const b of traces) {
      if (b.samples.length < 2) continue;
      gx.strokeStyle = b.color; gx.beginPath();
      b.samples.forEach((s, i) => { const xx = X(s.t), yy = Y(s[metric.key]); i ? gx.lineTo(xx, yy) : gx.moveTo(xx, yy); });
      gx.stroke();
    }
    gx.restore();

    // Marbles on the graph. Before a run: start-value marbles at t = 0 (the launch settings).
    // While the sim is collecting data: one marble riding the head of each curve (gone the
    // moment collection stops — offscreen or timed out — leaving just the finished curve).
    if (running) {
      for (const b of balls) {
        const last = b.samples[b.samples.length - 1];
        const cx = replaying ? Math.max(x0, Math.min(x1, X(t))) : X(last.t);
        const cy = Y(replaying ? b[metric.key] : last[metric.key]);   // centered on the true value, not clamped inside the plot
        drawMarbleAt(gx, cx, cy, 6.5, b.color);
      }
    } else if (!replaying && !(balls[0] && balls[0].samples.length >= 2)) {
      const mx = X(0);
      const launchV = parseInt(speedEl.value, 10) || 0;
      const marks = [{ val: metric.key === 'v' ? launchV : launchX, color: getCss('--ball') }];
      for (const sb of secondBalls) marks.push({ val: metric.key === 'v' ? 0 : sb.x, color: getCss('--ball2') });
      for (const m of marks) drawMarbleAt(gx, mx, Y(m.val), 6.5, m.color);
    }

    // puzzle target overlay: the goal graph the player is trying to match
    if (mode === 'puzzle' && currentPuzzle && currentPuzzle.target && metric.key === currentPuzzle.target.key) {
      const tgt = currentPuzzle.target;
      const clampY = xv => Math.max(ty + 1, Math.min(by - 1, Y(xv)));
      gx.save();
      gx.strokeStyle = getCss('--accent'); gx.lineWidth = 2.4; gx.setLineDash([7, 5]);
      gx.beginPath();
      let labelY;
      if (tgt.kind === 'flat') {                   // flat line at a fixed value
        const yy = clampY(tgt.value); labelY = yy;
        gx.moveTo(x0, yy); gx.lineTo(x1, yy);
      } else if (tgt.kind === 'poly') {            // piecewise-linear target shape
        tgt.pts.forEach((p, i) => { const px = X(p.t), py = clampY(p.x); i ? gx.lineTo(px, py) : gx.moveTo(px, py); });
        labelY = clampY(tgt.pts[tgt.pts.length - 1].x);
      }
      gx.stroke(); gx.setLineDash([]);
      gx.fillStyle = getCss('--accent'); gx.font = handFont(11, 700);
      gx.textAlign = 'right'; gx.textBaseline = 'bottom';
      gx.fillText('target', x1 - 4, labelY - 3);
      gx.restore();
    }
  }

  if (both) {
    // Two separate panels in one graph's height: each has its own time numbers,
    // with blank space between them (not a seamless shared axis). No time label.
    const padT = 14, numH = 18, gap = 22, botPad = 10;
    const panelH = (h - padT - botPad - 2 * numH - gap) / 2;
    const ty1 = padT, by1 = ty1 + panelH;
    const ty2 = by1 + numH + gap, by2 = ty2 + panelH;
    drawPanel({ key: 'v', label: 'Velocity', unit: 'm/s', yMax: base.yv }, ty1, by1, { vgrid: true });
    drawPanel({ key: 'x', label: 'Position', unit: 'm',  yMax: base.yd }, ty2, by2, { vgrid: true });
  } else {
    const spec = graphSpec();
    drawPanel({ key: spec.key, label: spec.label, unit: spec.unit, yMax: base.y }, 14, h - padB, { caption: true });
  }
}

function getCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function roundRect(c, x, y, w, h, r) {

  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();

// ─── Colour + hand-drawn cartoon helpers ────────────────────────────────────
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const lighten = (hex, t) => mixC(hex, 255, t);
const darken  = (hex, t) => mixC(hex, 0, t);

const INK = '#1a2230';                 // bold outline colour
const handFont = (size, weight) => (weight || 600) + ' ' + size + "px 'Lexend', system-ui, sans-serif";
function ink(width) { sx.strokeStyle = INK; sx.lineWidth = width; sx.lineJoin = 'round'; sx.lineCap = 'round'; }

// A flat two-tone panel: solid fill + a darker bottom "shade block" + bold ink outline.
function panelShaded(x, y, w, h, r, hex) {
  roundRect(sx, x, y, w, h, r); sx.fillStyle = hex; sx.fill();
  sx.save(); roundRect(sx, x, y, w, h, r); sx.clip();
  sx.fillStyle = darken(hex, 0.18); sx.fillRect(x, y + h * 0.62, w, h * 0.38);  // flat shade block
  sx.restore();
  roundRect(sx, x, y, w, h, r); ink(2.5); sx.stroke();
}

// A flat panel with a solid fill and a bold, smooth ink outline (no gradient, no shadow).
function panel3D(x, y, w, h, r, hex) {
  roundRect(sx, x, y, w, h, r);
  sx.fillStyle = hex; sx.fill();
  ink(2.5); sx.stroke();
}

// A little post connecting a sign down to its element, with an outlined knob where they meet.
function signPost(cx, topY, botY, hex) {
  ink(2.5); sx.beginPath(); sx.moveTo(cx, topY); sx.lineTo(cx, botY); sx.stroke();
  sx.beginPath(); sx.arc(cx, botY, 3.6, 0, 7); sx.fillStyle = hex; sx.fill(); ink(2); sx.stroke();
}

// A floating display sign (flat outlined panel on a post) with a hand-lettered label + optional sub-line.
function drawPieceSign(cx, elTopY, label, hex, fg, sub) {
  sx.font = handFont(17, 700);
  const tw = sx.measureText(label).width;
  let sw = Math.max(54, tw + 26), sh = sub ? 42 : 30;
  const syBot = elTopY - 15, syTop = syBot - sh;
  signPost(cx, syTop + sh, elTopY, hex);
  panelShaded(cx - sw / 2, syTop, sw, sh, 10, hex);
  sx.fillStyle = fg; sx.textAlign = 'center'; sx.textBaseline = 'middle';
  sx.font = handFont(17, 700);
  sx.fillText(label, cx, sub ? syTop + 15 : syTop + sh / 2 + 1);
  if (sub) {
    sx.font = handFont(13, 600); sx.fillStyle = lighten(hex, 0.55);
    sx.fillText(sub, cx, syTop + 31);
  }
  sx.textBaseline = 'alphabetic';
  return { x: cx - sw / 2, y: syTop, w: sw, h: sh };
}

// A small flat outlined round button (used for +/- on the target sign). Returns its hit circle.
function miniBtn(cx, cy, rad, label, hex, fg) {
  sx.beginPath(); sx.arc(cx, cy, rad, 0, 7); sx.fillStyle = lighten(hex, 0.2); sx.fill();
  ink(2); sx.stroke();
  sx.fillStyle = fg; sx.font = handFont(Math.round(rad * 1.9), 400);
  sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillText(label, cx, cy + 1);
  sx.textBaseline = 'alphabetic';
  return { cx, cy, r: rad };
}

// A horizontal tube (pipe) the ball shoots out of.
function drawTube(cx, cy, L, H, hex) {
  const x = cx - L / 2, y = cy - H / 2, r = Math.min(H / 2, 11);
  roundRect(sx, x, y, L, H, r); sx.fillStyle = hex; sx.fill();
  sx.save(); roundRect(sx, x, y, L, H, r); sx.clip();
  sx.fillStyle = darken(hex, 0.18); sx.fillRect(x, cy + H * 0.1, L, H * 0.4);   // shade block
  sx.restore();
  roundRect(sx, x, y, L, H, r); ink(2.5); sx.stroke();

  sx.fillStyle = darken(hex, 0.42);
  sx.beginPath(); sx.ellipse(x + 4.5, cy, 3, H / 2 - 5, 0, 0, 7); sx.fill();
  sx.beginPath(); sx.ellipse(x + L - 4.5, cy, 3, H / 2 - 5, 0, 0, 7); sx.fill();
}

// A little clock face with two hands (used for the timer control + the timed gate).
function drawClock(cx, cy, r, face) {
  sx.beginPath(); sx.arc(cx, cy, r, 0, 7); sx.fillStyle = face; sx.fill(); ink(1.8); sx.stroke();
  ink(1.8);
  sx.beginPath();
  sx.moveTo(cx, cy); sx.lineTo(cx, cy - r * 0.6);
  sx.moveTo(cx, cy); sx.lineTo(cx + r * 0.5, cy + r * 0.15);
  sx.stroke();
}

// ─── Drag & drop ──────────────────────────────────────────────────────────────
const inBox = (mx, my, b) => b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
const inCircle = (mx, my, c) => c && Math.hypot(mx - c.cx, my - c.cy) <= c.r + 2;

// Interactive controls on a target sign (direction / speed / timer). Checked before any drag.
function hitTargetControl(mx, my) {
  for (const g of targets) {
    const u = g._ui; if (!u) continue;
    if (inBox(mx, my, u.dirL)) return { g, kind: 'dirL' };
    if (inBox(mx, my, u.dirR)) return { g, kind: 'dirR' };
    if (inCircle(mx, my, u.minus)) return { g, kind: 'magMinus' };
    if (inCircle(mx, my, u.plus)) return { g, kind: 'magPlus' };
    if (inCircle(mx, my, u.tMinus)) return { g, kind: 'timeMinus' };
    if (inCircle(mx, my, u.tPlus)) return { g, kind: 'timePlus' };
    if (inBox(mx, my, u.tToggle)) return { g, kind: 'timeToggle' };
  }
  return null;
}
function applyTargetControl(c) {
  const g = c.g;
  if (c.kind === 'dirL') g.dir = -1;
  else if (c.kind === 'dirR') g.dir = 1;
  else if (c.kind === 'magMinus') g.mag = clamp(g.mag - TARGET_STEP, TARGET_STEP, TARGET_MAX);
  else if (c.kind === 'magPlus') g.mag = clamp(g.mag + TARGET_STEP, TARGET_STEP, TARGET_MAX);
  else if (c.kind === 'timeToggle') g.time = (g.time == null) ? 2 : null;
  else if (c.kind === 'timeMinus') g.time = clamp(Math.round(g.time) - 1, 0, RUN_TIME_CAP);
  else if (c.kind === 'timePlus') g.time = clamp(Math.round(g.time) + 1, 0, RUN_TIME_CAP);
}

// +/- steppers on a speed change sign
function hitPadControl(mx, my) {
  for (const el of boosts) {
    const u = el._ui; if (!u) continue;
    if (inCircle(mx, my, u.minus)) return { el, kind: 'minus' };
    if (inCircle(mx, my, u.plus)) return { el, kind: 'plus' };
  }
  return null;
}
function applyPadControl(c) {
  const dir = c.kind === 'plus' ? TARGET_STEP : -TARGET_STEP;
  let nv = clamp(c.el.dv + dir, -TARGET_MAX, TARGET_MAX);
  if (nv === 0) nv = dir;                               // a 0 m/s change does nothing — step past it
  c.el.dv = nv;
}

function hitPiece(mx, my) {
  const gY = groundY();
  // targets own a tall sign — test its full bounds or the tube
  for (const g of targets) {
    const u = g._ui;
    if (u && (inBox(mx, my, u.bounds) || inBox(mx, my, u.tube)))
      return { type: 'target', el: g };
  }
  // walls & boosts: their body on the ground, or their floating sign
  for (const wl of walls) if (Math.abs(mToPx(wl.x + WALL_D) - mx) < 14 && my >= gY - 50 && my <= gY + 6 || inBox(mx, my, wl._sign))
    return { type: 'wall', el: wl };
  for (const b of boosts) if (Math.abs(mToPx(b.x) - mx) < 22 && my >= gY - 17 && my <= gY + 6 || inBox(mx, my, b._sign))
    return { type: 'boost', el: b };
  // second balls: grab the sphere itself
  const br = Math.max(12, (BALL_R / TRACK_LEN) * (sceneDims().w - PAD_L - PAD_R) * 1.25);
  for (const bb of secondBalls) if (Math.abs(mToPx(bb.x) - mx) < br + 3 && my >= gY - 2 * br - 4 && my <= gY + 6)
    return { type: 'ball2', el: bb };

  for (const z of fricZones) {
    const xa = mToPx(z.x), xb = mToPx(z.x + z.len);
    if ((mx >= xa - 6 && mx <= xb + 6 && my >= gY - 4 && my <= gY + 28)) {
      const edge = Math.abs(mx - xa) <= 7 ? 'l' : Math.abs(mx - xb) <= 7 ? 'r' : null;
      return { type: 'friction', el: z, edge };
    }
    if (inBox(mx, my, z._sign)) return { type: 'friction', el: z, edge: null };
  }

function makeGhost(piece) {
  const g = document.createElement('div'); g.id = 'dragGhost';
  if (piece === 'boost') { g.textContent = '+' + BOOST_DV + ' m/s'; g.style.background = getCss('--boost'); g.style.color = '#063'; }
  else if (piece === 'wall') { g.textContent = 'wall'; g.style.background = getCss('--wall'); g.style.color = '#1c242e'; }
  else if (piece === 'target') { g.textContent = '▶ 6 m/s'; g.style.background = getCss('--target'); g.style.color = '#231141'; }
  else if (piece === 'ball2') { g.textContent = '● ball'; g.style.background = getCss('--ball'); g.style.color = '#2a0f0a'; }
  else { g.textContent = 'friction 2 m'; g.style.background = getCss('--fric'); g.style.color = '#3a1c08'; }
  document.body.appendChild(g); return g;
}
function moveGhost(g, cx, cy) { g.style.left = cx + 'px'; g.style.top = cy + 'px'; }

const snap = m => Math.round(m);   // placement snaps to 1 m increments
// Pieces (everything except friction patches, which may overlap anything) must stay at least
// MIN_GAP m apart, measured between their bodies (a wall's body stands WALL_D right of its x).
const MIN_GAP = 2;
const bodyX = (piece, x) => piece === 'wall' ? x + WALL_D : x;
function spacingOk(piece, x, self) {
  const bx = bodyX(piece, x);
  const others = [...boosts.map(e => [e, 'boost']), ...walls.map(e => [e, 'wall']), ...targets.map(e => [e, 'target']), ...secondBalls.map(e => [e, 'ball2'])];
  return others.every(([e, k]) => e === self || Math.abs(bodyX(k, e.x) - bx) >= MIN_GAP - 1e-9);
}
// Nearest legal snapped x to `want` (null if the track is too crowded).
function nearestSlot(piece, want, self) {
  const hi = piece === 'wall' ? TRACK_LEN - 1 : TRACK_LEN;
  for (let d = 0; d <= TRACK_LEN; d++) {
    for (const x of d ? [want - d, want + d] : [want]) {
      if (x >= 0 && x <= hi && spacingOk(piece, x, self)) return x;
    }
  }

}
function placePiece(type, m) {
  if (type !== 'friction') {
    if (type === 'ball2' && secondBalls.length >= 1) return;
    const x = nearestSlot(type, clamp(snap(type === 'wall' ? m - WALL_D : m), 0, TRACK_LEN), null);
    if (x === null) return;                         // no room: nothing is placed
    if (type === 'boost') boosts.push({ id: pieceId++, x, dv: BOOST_DV, used: false });
    else if (type === 'wall') walls.push({ id: pieceId++, x, bouncy: false });
    else if (type === 'target') { const g = { id: pieceId++, x, mag: 6, dir: 1, time: null, used: false }; targets.push(g); return g; }
    else { secondBalls.push({ id: pieceId++, x }); refreshBall2Chip(); }
  }
  else fricZones.push({ id: pieceId++, x: clamp(snap(m - FRIC_LEN / 2), 0, TRACK_LEN - FRIC_LEN), len: FRIC_LEN });
}

function overScene(cx, cy) {
  const r = sceneC.getBoundingClientRect();
  return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
}

// Only one extra ball is allowed — dim the chip and block its drag once placed.
const ball2Chip = document.querySelector('.chip.ball2');
function refreshBall2Chip() { if (ball2Chip) ball2Chip.classList.toggle('disabled', secondBalls.length >= 1); }

// Start a drag from a palette chip (create new piece)
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('pointerdown', e => {
    e.preventDefault();
    const piece = chip.dataset.piece;
    if (piece === 'ball2' && secondBalls.length >= 1) return;  // one extra ball max
    drag = { kind: 'new', piece, ghost: makeGhost(piece) };

  });

refreshBall2Chip();

// Start a drag on an existing placed piece (move / remove), or tap a target's sign controls
sceneC.addEventListener('pointerdown', e => {
  const r = sceneC.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  // on-sign controls take priority over dragging
  const ctl = hitTargetControl(mx, my);
  if (ctl) {
    e.preventDefault();
    applyTargetControl(ctl);
    if (!running) resetRun(); else drawScene();
    return;
  }
  const bctl = hitPadControl(mx, my);
  if (bctl) {
    e.preventDefault();
    applyPadControl(bctl);
    if (!running) resetRun(); else drawScene();
    return;
  }
  const hit = hitPiece(mx, my);
  if (!hit) return;
  e.preventDefault();
  sceneC.setPointerCapture(e.pointerId);
  // grabbing a friction patch's end → resize; its middle → move
  const kind = (hit.type === 'friction' && hit.edge) ? 'resize' : 'move';
  drag = { kind, piece: hit.type, el: hit.el, edge: hit.edge, downX: e.clientX, downY: e.clientY, moved: false };
});

// ─── Hover tooltips: one brief line per element ───────────────────────────────
const TIPS = {
  boost:    'Speed change: adds its value to the ball\'s speed (+ speeds up, − slows down). Use ± to change it in steps of 2.',
  target:   'Target speed: sets the ball to the speed and direction shown. A timer holds the ball until that time.',
  friction: 'Friction patch: slows the ball while it\'s on it. Drag its ends to resize.',
  wall:     'Wall: stops the ball. Click it to make it bouncy.',
  wallBouncy: 'Bouncy wall: reflects the ball at the same speed. Click it to make it a plain wall.',
  ball2:    'Second ball: waits at rest. When hit, it takes the first ball\'s speed and the first stops.',
};
const tipEl = document.getElementById('tip');
function showTip(text, cx, cy) {
  if (!text) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = text; tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(6, Math.min(innerWidth - w - 6, cx + 14)) + 'px';
  tipEl.style.top = (cy + 18 + h > innerHeight ? cy - h - 10 : cy + 18) + 'px';
}
// palette chips get their text from TIPS; any element with data-tip shows it on hover
document.querySelectorAll('.chip').forEach(c => { c.dataset.tip = TIPS[c.dataset.piece]; });
document.addEventListener('pointermove', e => {
  if (drag || e.target === sceneC) return;

document.addEventListener('pointerleave', () => showTip(null));
sceneC.addEventListener('pointerleave', () => showTip(null));

// Cursor hint when hovering placed pieces (resize vs grab) + tooltip
sceneC.addEventListener('pointermove', e => {

  const hit = hitPiece(e.clientX - r.left, e.clientY - r.top);

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.kind === 'new') {
    moveGhost(drag.ghost, e.clientX, e.clientY);

    if (Math.hypot(e.clientX - drag.downX, e.clientY - drag.downY) > 4) drag.moved = true;
    const r = sceneC.getBoundingClientRect();
    const m = pxToM(e.clientX - r.left);
    if (drag.piece === 'friction') drag.el.x = clamp(snap(m - drag.el.len / 2), 0, TRACK_LEN - drag.el.len);
    else {
      const want = clamp(snap(drag.piece === 'wall' ? m - WALL_D : m), 0, TRACK_LEN);
      const nx = nearestSlot(drag.piece, want, drag.el);   // stay ≥ MIN_GAP from other pieces
      if (nx !== null) drag.el.x = nx;
    }
    if (!running) { resetRun(); } else { drawScene(); }
  } else if (drag.kind === 'resize') {
    const r = sceneC.getBoundingClientRect();
    const z = drag.el, m = snap(pxToM(e.clientX - r.left));

      const right = z.x + z.len, nl = clamp(m, 0, right - 1);
      z.x = nl; z.len = right - nl;
    } else {                           // right end moves; left end stays put
      const nr = clamp(m, z.x + 1, TRACK_LEN);
      z.len = nr - z.x;
    }
    if (!running) { resetRun(); } else { drawScene(); }
  }
});

window.addEventListener('pointerup', e => {
  if (!drag) return;
  if (drag.kind === 'new') {
    drag.ghost.remove();
    if (overScene(e.clientX, e.clientY)) {
      const r = sceneC.getBoundingClientRect();
      placePiece(drag.piece, pxToM(e.clientX - r.left));
      if (!running) resetRun(); else drawScene();
    }
  } else if (drag.kind === 'move') {
    if (!overScene(e.clientX, e.clientY)) {
      // drop off the track → delete
      deletePiece(drag.piece, drag.el);
    } else if (!drag.moved) {

      const piece = drag.piece, el = drag.el, now = performance.now();
      if (piece === 'wall') { el.bouncy = !el.bouncy; if (!running) resetRun(); else drawScene(); }   // click toggles bouncy
      if (lastClick && lastClick.el === el && now - lastClick.time < 400) {
        lastClick = null;

function deletePiece(piece, el) {

  else if (piece === 'target') targets = targets.filter(g => g !== el);
  else if (piece === 'ball2') { secondBalls = secondBalls.filter(b => b !== el); refreshBall2Chip(); }
  else fricZones = fricZones.filter(z => z !== el);

  if (dcEl.hidden) return;
  if (dcEl.contains(e.target)) return;
  if (e.target === sceneC) return;   // scene handler may reopen it for another piece
  closeDeleteConfirm();
}, true);

// Hidden dev slider (type "dev") to tune friction deceleration.
(function(){
  let seq = '';
  window.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    seq = (seq + e.key.toLowerCase()).slice(-3);
    if (seq === 'dev') {
      let box = document.getElementById('devBox');
      if (box) { box.remove(); return; }
      box = document.createElement('div'); box.id = 'devBox';
      box.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:50;background:#141a24;border:1px solid #2a3442;border-radius:8px;padding:8px 10px;font:12px sans-serif;color:#8a97a8;display:flex;gap:8px;align-items:center';
      box.innerHTML = 'friction a <input type="range" id="devFric" min="0.5" max="8" step="0.1" value="'+FRICTION_DECEL+'"><span id="devFricV">'+FRICTION_DECEL.toFixed(1)+'</span> m/s²';
      document.body.appendChild(box);
      const s = box.querySelector('#devFric'), vlab = box.querySelector('#devFricV');
      s.addEventListener('input', () => { FRICTION_DECEL = parseFloat(s.value); vlab.textContent = FRICTION_DECEL.toFixed(1); if (!running) resetRun(); });
    }
  });
})();

// ─── Puzzle mode ────────────────────────────────────────────────────────────────
// 6 position + 6 velocity challenges. No names or hints — the player just reads the
// target line off the graph and matches it. Each target carries its own axis key
// ('x' position or 'v' velocity). The rest are placeholders that unlock progressively.
const PUZZLES = {
  position: [
    { id: 'pos1', metric: 'position', stars: 1, target: { kind: 'flat', key: 'x', value: 5 } },
    { id: 'pos2', metric: 'position', stars: 1 },
    { id: 'pos3', metric: 'position', stars: 2, unlocked: true,
      target: { kind: 'poly', key: 'x', pts: [{ t: 0, x: 0 }, { t: 1, x: 3 }, { t: 5, x: 7 }] } },
    { id: 'pos4', metric: 'position', stars: 2 },
    { id: 'pos5', metric: 'position', stars: 3, unlocked: true,
      target: { kind: 'poly', key: 'x', pts: [{ t: 0, x: 1 }, { t: 3, x: 7 }, { t: 5, x: 1 }] } },
    { id: 'pos6', metric: 'position', stars: 3 },
  ],
  velocity: [
    { id: 'vel1', metric: 'velocity', stars: 1, target: { kind: 'flat', key: 'v', value: 2 } },
    { id: 'vel2', metric: 'velocity', stars: 1 },
    { id: 'vel3', metric: 'velocity', stars: 2 },
    { id: 'vel4', metric: 'velocity', stars: 2 },
    { id: 'vel5', metric: 'velocity', stars: 3 },
    { id: 'vel6', metric: 'velocity', stars: 3 },
  ],
};
const solvedPuzzles = new Set();
try { (JSON.parse(localStorage.getItem('launcher-puzzles') || '[]')).forEach(id => solvedPuzzles.add(id)); } catch (e) {}
function savePuzzles() { try { localStorage.setItem('launcher-puzzles', JSON.stringify([...solvedPuzzles])); } catch (e) {} }
function puzzleUnlocked(list, i) { return !!list[i].unlocked || i === 0 || solvedPuzzles.has(list[i - 1].id); }
// linear-interpolate a polyline target's position at time tt (clamped to the ends)
function interpPoly(pts, tt) {
  if (tt <= pts[0].t) return pts[0].x;
  for (let i = 1; i < pts.length; i++) {
    if (tt <= pts[i].t) { const a = pts[i - 1], b = pts[i]; return a.x + (b.x - a.x) * (tt - a.t) / (b.t - a.t); }
  }
  return pts[pts.length - 1].x;
}
function stars(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n); }

function renderPuzzles() {
  for (const [key, rowId] of [['position', 'pzPosRow'], ['velocity', 'pzVelRow']]) {
    const row = document.getElementById(rowId); row.innerHTML = '';
    PUZZLES[key].forEach((p, i) => {
      const unlocked = puzzleUnlocked(PUZZLES[key], i), solved = solvedPuzzles.has(p.id);
      const btn = document.createElement('button');
      btn.className = 'pzBtn' + (unlocked ? '' : ' locked') + (solved ? ' solved' : '')
        + (currentPuzzle && currentPuzzle.id === p.id ? ' active' : '');
      btn.disabled = !unlocked;
      btn.innerHTML = '<span class="pzMark">' + (solved ? '✓' : (unlocked ? '' : '🔒')) + '</span>'
        + '<span class="pzStars">' + stars(p.stars) + '</span>';
      btn.addEventListener('click', () => selectPuzzle(p));
      row.appendChild(btn);
    });
  }
}

function updatePuzzleStatus() {
  const el = document.getElementById('puzzleStatus');
  if (mode !== 'puzzle' || !currentPuzzle) { el.hidden = true; return; }
  el.hidden = false;
  const solved = solvedPuzzles.has(currentPuzzle.id), playable = !!currentPuzzle.target;
  el.innerHTML = '<span class="psStars">' + stars(currentPuzzle.stars) + '</span>'
    + (playable ? '' : '<span class="psGoal">Coming soon — not built yet.</span>')
    + (solved ? '<span class="psSolved">✓ Solved</span>' : '');
}

function selectPuzzle(p) {
  currentPuzzle = p; graphType = p.metric; puzzleGraded = false;
  renderPuzzles(); updatePuzzleStatus();
  resetRun();   // switching puzzles always starts from a clean track
}

function gradePuzzle() {
  if (puzzleGraded || !currentPuzzle || !currentPuzzle.target || solvedPuzzles.has(currentPuzzle.id)) {
    if (currentPuzzle && solvedPuzzles.has(currentPuzzle.id)) puzzleGraded = true;
    return;
  }
  const win = AXES.position.t;                         // grade once the 5 s window is filled
  const s = balls[0].samples.filter(p => p.t <= win);
  if (!s.length || s[s.length - 1].t < win - 0.05) return;
  puzzleGraded = true;
  const tgt = currentPuzzle.target, key = tgt.key;
  let pass = false, maxDev = 0;
  if (tgt.kind === 'flat') {                           // value stays near a constant
    for (const p of s) maxDev = Math.max(maxDev, Math.abs(p[key] - tgt.value));
    pass = (maxDev <= PUZZLE_TOL);
  } else if (tgt.kind === 'poly') {                    // value tracks the target shape
    for (const p of s) maxDev = Math.max(maxDev, Math.abs(p[key] - interpPoly(tgt.pts, p.t)));
    pass = (maxDev <= PUZZLE_TOL);
  }
  if (pass) { solvedPuzzles.add(currentPuzzle.id); savePuzzles(); renderPuzzles(); updatePuzzleStatus(); }
}
const PUZZLE_TOL = 0.9;   // max position deviation (m) allowed when matching a target line

function setMode(m) {
  mode = m;
  [...document.querySelectorAll('#modeTabs button')].forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  const puzzle = m === 'puzzle';
  document.getElementById('puzzlePanel').hidden = !puzzle;
  document.getElementById('graphTabs').hidden = puzzle;
  if (puzzle) {
    renderPuzzles();
    if (!currentPuzzle) selectPuzzle(PUZZLES.position[0]);
    else { updatePuzzleStatus(); if (!running) resetRun(); else drawGraph(); }
  } else {
    document.getElementById('puzzleStatus').hidden = true;
    [...document.querySelectorAll('#graphTabs button')].forEach(b => b.classList.toggle('active', b.dataset.g === graphType));
    if (!running) resetRun(); else drawGraph();
  }
}
document.getElementById('modeTabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setMode(b.dataset.mode);
});

// ─── Init ─────────────────────────────────────────────────────────────────────
resetRun();
requestAnimationFrame(frame);
// redraw once the hand-drawn font has loaded so canvas labels pick it up
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawScene(); drawGraph(); });
</script>
</body>
